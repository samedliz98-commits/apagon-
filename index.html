  const tg=ctx.createRadialGradient(0,-u*57,0,0,-u*57,u*(braking?38:22)); tg.addColorStop(0,`rgba(255,50,30,${braking?.6:.35})`); tg.addColorStop(1,'rgba(255,50,30,0)'); ctx.fillStyle=tg; ctx.fillRect(-u*40,-u*95,u*80,u*80);
  ctx.fillStyle='#16171c'; rr(-u*15,-u*70,u*30,u*11,u*5); ctx.fill();
  ctx.fillStyle='#1F4FB5';
  ctx.beginPath(); ctx.moveTo(-u*14,-u*68); ctx.lineTo(-u*27,-u*58); ctx.lineTo(-u*24,-u*40); ctx.lineTo(-u*17,-u*42); ctx.lineTo(-u*19,-u*56); ctx.lineTo(-u*9,-u*64); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(u*14,-u*68); ctx.lineTo(u*27,-u*58); ctx.lineTo(u*24,-u*40); ctx.lineTo(u*17,-u*42); ctx.lineTo(u*19,-u*56); ctx.lineTo(u*9,-u*64); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0d0d10'; rr(-u*27,-u*42,u*11,u*6,u*2); ctx.fill(); rr(u*16,-u*42,u*11,u*6,u*2); ctx.fill();
  ctx.strokeStyle='#2a2c33'; ctx.lineWidth=u*2.4; ctx.beginPath(); ctx.moveTo(-u*34,-u*90); ctx.lineTo(u*34,-u*90); ctx.stroke();
  ctx.lineWidth=u*1.4; ctx.beginPath(); ctx.moveTo(-u*28,-u*90); ctx.lineTo(-u*32,-u*104); ctx.moveTo(u*28,-u*90); ctx.lineTo(u*32,-u*104); ctx.stroke();
  ctx.fillStyle='#1b1c22'; ctx.beginPath(); ctx.ellipse(-u*33,-u*107,u*5,u*3.6,0,0,Math.PI*2); ctx.ellipse(u*33,-u*107,u*5,u*3.6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#F28C28'; ctx.beginPath(); ctx.moveTo(-u*14,-u*66); ctx.lineTo(u*14,-u*66); ctx.lineTo(u*22,-u*104); ctx.quadraticCurveTo(0,-u*112,-u*22,-u*104); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(-u*18,-u*88,u*36,u*2.4); ctx.fillRect(-u*16,-u*80,u*32,u*2.4);
  ctx.strokeStyle='#F28C28'; ctx.lineWidth=u*7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-u*19,-u*100); ctx.lineTo(-u*31,-u*91); ctx.moveTo(u*19,-u*100); ctx.lineTo(u*31,-u*91); ctx.stroke(); ctx.lineCap='butt';
  ctx.fillStyle='#0f0f12'; ctx.beginPath(); ctx.arc(-u*32,-u*90,u*3.4,0,Math.PI*2); ctx.arc(u*32,-u*90,u*3.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFC21A'; ctx.beginPath(); ctx.arc(0,-u*120,u*13.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#E0A000'; ctx.fillRect(-u*14.5,-u*115,u*29,u*3);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-u*5,-u*126,u*4,u*2.2,-.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ======================= HUD ======================= */
let hudKey='';
function hud(){
  const prog=clamp((position+PZ)/GOAL,0,1), km=Math.max(0,R.km*(1-prog));
  const kmTxt=km<10?km.toFixed(1):String(Math.ceil(km)), spd=KMH(speed), f=Math.round(fuel);
  const key=kmTxt+'|'+spd+'|'+f; if(key===hudKey) return; hudKey=key;
  $r('#rKm').innerHTML=`${kmTxt}<i>km</i>`; $r('#rSpd').textContent=spd;
  const fb=$r('#rFuel'); fb.style.transform=`scaleX(${clamp(fuel/100,0,1)})`; fb.classList.toggle('low',fuel<25);
  $r('#rMe').style.left=(prog*100)+'%';
}

/* ======================= Tarjetas ======================= */
function card(html){ $r('#rSheet').innerHTML=html; $r('#rCard').hidden=false; }
function uncard(){ $r('#rCard').hidden=true; }
function chispa(m,s){ const api=API(); return api&&api.chispa?api.chispa(m,s):''; }
function introCard(){
  state='intro'; const first=!CB.paseo;
  card(`<div class="kick">${first?'VIAJE EN MOTO':'PASEO EN MOTO'} · ${R.km} KM</div>${chispa('wow',58)}<h2>${R.from} → ${R.to}</h2><p>${R.blurb}</p>
    <div class="rhow"><b>MANUBRIO</b><span>Desliza el dedo en la barra de abajo. Mientras más lo corres, más giras.</span>
      <b>FRENO</b><span>El acelerador va solo. Mantén el botón rojo para frenar.</span>
      <b>PITO</b><span>El carro de adelante se aparta y las vacas salen corriendo.</span>
      <b>BOMBA</b><span>Entra al canal derecho y frena para echar gasolina.</span>
      <b>ALCABALA</b><span>Pasa a menos de 55 km/h o el guardia te para.</span></div>
    <div class="rrow"><button type="button" id="rcBack">Volver</button><button type="button" class="rgo" id="rcGo">Arrancar</button></div>`);
  $r('#rcBack').onclick=()=>{ API().sfx.click(); quit(); };
  $r('#rcGo').onclick=()=>{ API().ensureAudio(); API().sfx.click(); go(); };
}
function go(){ uncard(); position=0; speed=0; playerX=0; fuel=100; timeT=0; steer=0; light=1; phase='on'; phaseT=rnd(14,20); $r('#rApagon').hidden=true;
  stats={holes:0,crashes:0,cans:0,alcabalas:0,bomba:false}; CP={pos:0,name:R.from}; stopFired=new Set();
  segs.forEach(s=>{ s.checked=false; s.sprites.forEach(sp=>{ sp.hit=false; sp.got=false; if(sp.t==='vaca'){ sp.off=(Math.random()<.5?-1:1)*1.7; sp.go=false; sp.run=false; } }); });
  spawnCars(0); state='play'; engStart(); msg('¡Dale!',`${R.km} km hasta ${R.to}`,1.6); }
function pauseCard(){ if(state!=='play') return; state='pause'; engSet(0,false);
  card(`<h2>Pausa</h2><p class="dim">${R.from} → ${R.to} · faltan ${Math.ceil(R.km*(1-clamp((position+PZ)/GOAL,0,1)))} km</p>
    <div class="rrow"><button type="button" id="rcQuit">Salir del viaje</button><button type="button" class="rgo" id="rcGo">Seguir</button></div>`);
  $r('#rcGo').onclick=()=>{ uncard(); state='play'; last=performance.now(); API().ensureAudio(); };
  $r('#rcQuit').onclick=()=>{ quit(); }; }
function outOfGas(){ state='fail'; engSet(0,false); S.lose(); vib(150);
  const km=Math.ceil(R.km*(1-clamp((position+PZ)/GOAL,0,1)));
  card(`${chispa('sad',60)}<h2 class="bad">Te quedaste sin gasolina</h2><p>Te faltaron ${km} km para llegar a ${R.to}.</p><p class="dim">Frena en las bombas del canal derecho y agarra los bidones amarillos. Cada hueco y cada choque te bota gasolina.</p>
    ${CP&&CP.pos>0?`<button type="button" class="rwide rgreen" id="rcCP">Seguir desde ${CP.name} con medio tanque</button>`:''}
    <div class="rrow"><button type="button" id="rcQuit">Salir</button><button type="button" class="rgo" id="rcAgain">Empezar de nuevo</button></div>`);
  const cp=$r('#rcCP'); if(cp) cp.onclick=()=>{ uncard(); position=CP.pos; speed=0; fuel=55; playerX=0; invul=1; spawnCars(position); state='play'; msg(CP.name,'Tanque a la mitad. ¡Dale!',1.6); };
  $r('#rcAgain').onclick=()=>{ go(); }; $r('#rcQuit').onclick=()=>quit(); }
function arrive(){ state='done'; engSet(0,false); S.win(); vib([30,40,30]);
  const clean=stats.holes===0&&stats.crashes===0; const res=CB.onArrive?CB.onArrive({time:timeT,clean,holes:stats.holes,crashes:stats.crashes})||{}:{};
  card(`${chispa('win',64)}<div class="kick">BIENVENIDO</div><h2>¡Llegaste a ${R.to}!</h2><p class="dim">${R.km} km desde ${R.from} en moto${clean?' · sin un solo golpe':''}</p>
    <div class="rstats"><div class="rstat"><span>TIEMPO</span><b>${fmtTime(timeT)}</b></div><div class="rstat"><span>HUECOS</span><b>${stats.holes}</b></div>
      <div class="rstat"><span>CHOQUES</span><b>${stats.crashes}</b></div><div class="rstat"><span>ALCABALAS</span><b>${stats.alcabalas}</b></div></div>
    ${res.record?'<p class="rgain">¡Nuevo récord en esta ruta!</p>':res.best?`<p class="dim">Tu mejor tiempo: ${fmtTime(res.best)}</p>`:''}
    ${res.bulbs?`<p class="rgain">+${res.bulbs} bombillos${res.first?` · ¡${R.to} desbloqueada!`:''}</p>`:''}
    <button type="button" class="rwide rgo" id="rcDone">${res.first?`Entrar a ${R.to}`:'Listo'}</button>
    ${res.first?'':'<button type="button" class="rwide" id="rcAgain">Manejar otra vez</button>'}`);
  $r('#rcDone').onclick=()=>{ close(); CB.onDone&&CB.onDone(); };
  const ag=$r('#rcAgain'); if(ag) ag.onclick=()=>go(); }

/* ======================= Controles ======================= */
function bind(){
  const pad=$r('#rPad'), knob=$r('#rKnob');
  const setSteer=e=>{ const r=pad.getBoundingClientRect(); const v=clamp((e.clientX-(r.left+r.width/2))/(r.width*.38),-1,1); input.steer=Math.abs(v)<.06?0:v;
    knob.style.transform=`translateX(${input.steer*r.width*.38}px)`; };
  pad.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ pad.setPointerCapture(e.pointerId); }catch{} input.pad=e.pointerId; setSteer(e); API().ensureAudio(); });
  pad.addEventListener('pointermove',e=>{ if(e.pointerId===input.pad) setSteer(e); });
  const end=e=>{ if(e.pointerId!==input.pad) return; input.pad=null; input.steer=0; knob.style.transform=''; };
  pad.addEventListener('pointerup',end); pad.addEventListener('pointercancel',end);
  const br=$r('#rBrake');
  br.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ br.setPointerCapture(e.pointerId); }catch{} input.brake=true; br.classList.add('on'); });
  const bEnd=()=>{ input.brake=false; br.classList.remove('on'); }; br.addEventListener('pointerup',bEnd); br.addEventListener('pointercancel',bEnd); br.addEventListener('lostpointercapture',bEnd);
  $r('#rHorn').addEventListener('click',honk);
  $r('#rPause').addEventListener('click',pauseCard);
  $r('#rRadio').addEventListener('click',()=>API().openRadio());
  addEventListener('keydown',e=>{ if($r('#sRuta').hidden) return; const k=e.key.toLowerCase(); keys[k]=true;
    if(['arrowleft','arrowright','arrowdown','arrowup',' '].includes(k)) e.preventDefault();
    if(k==='h') honk(); if(k==='escape'||k==='p'){ if(state==='play') pauseCard(); } });
  addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') pauseCard(); });
}

/* ======================= Bucle ======================= */
function frame(now){
  if(state==='off') return; raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state!=='pause'&&state!=='fail'){ update(dt); if(shake>0) shake=Math.max(0,shake-dt*1.5); }
  render(now/1000); if(state==='play') hud();
  if(state!=='play') engSet(0,false);
}

/* ======================= Abrir y cerrar ======================= */
let ready=false;
function start(id,cb){
  if(!document.getElementById('sRuta')) injectUI();
  if(!ready){ cvs=$r('#rcv'); ctx=cvs.getContext('2d'); shade=document.createElement('canvas'); sx=shade.getContext('2d'); bind(); ready=true; }
  R=Object.assign({},ROUTES[id]); R.stops=R.stops.map(s=>({...s})); T=THEMES[R.theme]; CB=cb||{}; GOAL=R.len;
  build(); ridges=makeRidges(T.ridge); spawnCars(0);
  $r('#rDest').textContent=R.to; $r('#rFrom').textContent=R.from.toUpperCase(); $r('#rTo').textContent=R.to.toUpperCase();
  const line=$r('#rLine'); line.querySelectorAll('.rdot').forEach(e=>e.remove());
  R.stops.forEach(s=>{ const d=document.createElement('i'); d.className='rdot'+(s.bomba?' bomba':''); d.style.left=(s.at*100)+'%'; line.insertBefore(d,$r('#rMe')); });
  $r('#rApagon').hidden=true; $r('#rBomba').hidden=true; $r('#rMsg').classList.remove('on');
  position=0; speed=0; playerX=0; fuel=100; timeT=0; light=1; shake=0; invul=0; hudKey='';
  $r('#sRuta').hidden=false; resize(); hud();
  state='intro'; introCard(); last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
}
function close(){ state='off'; cancelAnimationFrame(raf); engStop(); const s=$r('#sRuta'); if(s) s.hidden=true; input.brake=false; input.steer=0; input.pad=null; }
function quit(){ close(); CB.onQuit&&CB.onQuit(); }
window.ApagonRuta={start,close,ROUTES,_debug:{get state(){return state;},set position(v){position=v;},get position(){return position;},get GOAL(){return GOAL;},get fuel(){return fuel;},set fuel(v){fuel=v;},get speed(){return speed;},input,honk,get segs(){return segs;},get stats(){return stats;},arrive,setLight(v){light=v;},blackout(){ phase='on'; phaseT=0; }}};
})();

</script>
