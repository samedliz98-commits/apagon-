<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Apagón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@500;600;700;800&display=swap">
<style>
/* Layout: juego de una pantalla en vertical — portada, mapa de barrios, calle 3D (isométrica, dibujada a mano en canvas). Estética única: noche venezolana, luz amarilla de bombillo. */
:root{
  --night:#0B0F1E; --night-2:#131936; --tile:#1A2143; --tile-hi:#232C57; --tile-lo:#11162F; --wire:#3A4470;
  --light:#FFD23F; --warm:#FFB547; --plant:#3EE6B5; --blue:#46C8FF; --danger:#FF5D5D; --text:#EEF0FF; --dim:#8C93BD;
  --f-display:"Bungee", "Arial Black", Impact, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.maracaibo{--night:#160E24;--night-2:#22163A;--tile:#2A1C45;--tile-hi:#352557;--tile-lo:#1B1230;--wire:#5A4478}
body.merida{--night:#0A1620;--night-2:#11243A;--tile:#16304A;--tile-hi:#1D3B5A;--tile-lo:#0E1E30;--wire:#3A5A78}
body.guayana{--night:#081814;--night-2:#0F2A24;--tile:#153A31;--tile-hi:#1C4A3F;--tile-lo:#0C231D;--wire:#2F6B5C}
.app{height:100%;max-width:560px;margin:0 auto;position:relative;display:flex;flex-direction:column;padding-inline:16px;overflow:hidden}
.screen{display:flex;flex-direction:column;height:100%;min-height:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--light);outline-offset:2px}

/* ---------- Portada ---------- */
.title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:11px;text-align:center;padding-block:14px;min-height:0;overflow-y:auto}
.logo{font-family:var(--f-display);font-size:clamp(52px,16vw,92px);line-height:.9;color:var(--light);text-shadow:0 0 10px rgba(255,210,63,.8),0 0 34px rgba(255,181,71,.55);animation:flicker 4.5s infinite}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.2;text-shadow:none}}
.ver{font-family:var(--f-display);font-size:13px;color:#201600;background:var(--light);border-radius:8px;padding:2px 8px;margin-top:-4px}
.tag{color:var(--dim);font-size:14.5px;margin:0;max-width:32ch;line-height:1.4}
.big{font-family:var(--f-display);font-size:20px;background:var(--light);color:#201600;border:0;border-radius:16px;padding:13px 30px;box-shadow:0 6px 0 #B8891A,0 0 30px rgba(255,210,63,.3);min-width:250px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #B8891A}
.big.alt{background:var(--tile);color:var(--text);box-shadow:0 5px 0 #070A16;border:2px solid var(--wire);font-size:16px;padding:10px 24px}
.big.alt small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--light);margin-top:3px}
.big.storm{border-color:#7FB2FF}
.big.storm small{color:#9FC4FF}
.big.moto{border-color:#F28C28}
.big.moto small{color:#FFB24A}
.routes{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.route{display:flex;gap:10px;align-items:center;background:var(--tile);border:1.5px solid var(--wire);border-radius:14px;padding:10px 12px}
.route div{flex:1;min-width:0}
.route b{display:block;font-size:15px}
.route small{display:block;color:var(--dim);font-size:12.5px;line-height:1.3}
.route button{flex:none;border:0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px;background:var(--light);color:#201600}
.route button:disabled{background:var(--tile-lo);color:var(--dim)}
.route.off{opacity:.7}
.lockmsg .go{border:0;border-radius:14px;padding:12px 22px;font-weight:800;font-size:15px;background:var(--light);color:#201600;box-shadow:0 5px 0 #B8891A}
.lockmsg .km{font-family:var(--f-display);font-size:15px;color:#FFB24A}
.minirow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pillbtn{background:var(--tile-lo);border:1.5px solid var(--wire);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pillbtn[aria-pressed="false"]{opacity:.55}
.bulbs{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--light);font-variant-numeric:tabular-nums}
.bulbs svg{flex:none}
.skyline{width:100%;height:auto;display:block}
.chispa-float{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.link{background:none;border:0;color:var(--dim);font-size:13px;text-decoration:underline;padding:6px}

/* ---------- Mapa ---------- */
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 8px}
.head h1{font-family:var(--f-display);font-size:19px;margin:0;color:var(--light);flex:1;text-align:center}
.icon{background:var(--tile);border:1.5px solid var(--wire);border-radius:12px;min-width:44px;height:44px;padding:0 10px;font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tabs{display:flex;gap:6px;padding-bottom:6px}
.tabs button{flex:1;background:var(--tile-lo);border:1.5px solid var(--wire);border-radius:12px;padding:7px 4px;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tabs button small{font-weight:600;font-size:10.5px;color:var(--dim);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--light);color:#201600;border-color:var(--light)}
.tabs button[aria-selected="true"] small{color:#5A4200}
.tabs button.locked{opacity:.55}
.mapwrap{flex:1;min-height:0;overflow-y:auto;position:relative;border-radius:18px;background:linear-gradient(to bottom,var(--night-2),var(--night));-webkit-overflow-scrolling:touch}
.map{position:relative}
.map svg.path{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0}
.node .dot{width:60px;height:60px;border-radius:50%;background:var(--tile);border:3px solid var(--wire);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:19px;box-shadow:0 5px 0 #070A16;position:relative}
.node.done .dot{background:var(--light);color:#201600;border-color:#FFF1B8;box-shadow:0 5px 0 #B8891A,0 0 26px rgba(255,210,63,.55)}
.node.current .dot{border-color:var(--light);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 5px 0 #070A16,0 0 0 0 rgba(255,210,63,.6)}100%{box-shadow:0 5px 0 #070A16,0 0 0 18px rgba(255,210,63,0)}}
.node.locked{opacity:.4}
.node .nm{font-weight:800;font-size:12px;background:rgba(5,7,16,.72);padding:2px 8px;border-radius:99px;white-space:nowrap}
.node .st{font-size:13px;letter-spacing:1px;color:var(--wire);line-height:1}
.node .st .on{color:var(--light)}
.node .me{position:absolute;top:-50px;pointer-events:none}
.node .tagm{font-family:var(--f-body);font-size:10px;font-weight:800;color:#062A20;background:var(--plant);border-radius:6px;padding:1px 5px;position:absolute;top:-9px;right:-22px;white-space:nowrap}
.lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.lockmsg b{font-family:var(--f-display);font-size:22px;color:var(--light)}
.foot{display:flex;justify-content:space-between;align-items:center;padding-block:8px 14px;color:var(--dim);font-size:12.5px}

/* ---------- Juego ---------- */
.hud{display:flex;align-items:center;gap:8px;padding-block:10px 2px}
.hud .where{flex:1;min-width:0}
.where b{display:block;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{color:var(--dim);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .icon{min-width:40px;height:40px;padding:0 8px}
.battery{display:flex;align-items:center;gap:10px;padding-block:4px}
.cell{flex:1;height:16px;border:2px solid var(--wire);border-radius:6px;padding:2px;position:relative}
.cell::after{content:"";position:absolute;right:-7px;top:3px;width:4px;height:6px;border-radius:0 2px 2px 0;background:var(--wire)}
.cell i{display:block;height:100%;border-radius:3px;background:var(--plant);transition:width .25s, background .25s}
.cell.low i{background:var(--danger);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.batt-txt{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.board-wrap{flex:1;min-height:0;position:relative;margin-inline:-16px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;display:block}
.status{text-align:center;color:var(--dim);font-size:13.5px;padding-block:2px;font-variant-numeric:tabular-nums;line-height:1.35}
.status b{color:var(--light)}
.status .bl{color:var(--blue)}
.status .bad{color:var(--danger);font-weight:800}
.status .ok{color:var(--plant);font-weight:800}
.controls{display:flex;gap:8px;padding-block:8px 16px}
.controls button{flex:1;background:var(--tile);border:1.5px solid var(--wire);border-radius:14px;height:50px;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 4px 0 #070A16}
.controls button:active{transform:translateY(3px);box-shadow:0 1px 0 #070A16}
.controls button small{font-weight:600;font-size:11px;color:var(--dim)}
.controls button:disabled{opacity:.4}

/* ---------- Ventanas ---------- */
.modal{position:absolute;inset:0;background:rgba(5,7,16,.76);display:flex;align-items:center;justify-content:center;padding-inline:16px;z-index:5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:400px;max-height:calc(100% - 32px);overflow-y:auto;background:var(--night-2);border:2px solid var(--wire);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:11px;text-align:center;align-items:center;animation:rise .35s cubic-bezier(.3,1.3,.6,1)}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
.sheet h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.05;text-wrap:balance}
.sheet h2.win{color:var(--light);text-shadow:0 0 18px rgba(255,210,63,.6)}
.sheet h2.lose{color:var(--danger)}
.sheet p{margin:0}
.bigstars{font-size:42px;letter-spacing:6px;color:var(--wire);line-height:1}
.bigstars span{display:inline-block;transition:transform .3s cubic-bezier(.3,1.8,.5,1),color .2s}
.bigstars .on{color:var(--light);text-shadow:0 0 14px rgba(255,210,63,.7);transform:scale(1.15)}
.quote{background:var(--tile);border-radius:14px;padding:10px 12px;font-size:14.5px;width:100%}
.quote small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.sub{color:var(--dim);font-size:13.5px}
.gain{color:var(--light);font-weight:800;font-size:14px}
.sheet .row{display:flex;gap:8px;width:100%}
.sheet .row button,.sheet .wide{flex:1;min-height:50px;border-radius:14px;font-weight:800;border:1.5px solid var(--wire);background:var(--tile);padding:6px 10px}
.sheet .wide{width:100%;flex:none}
.sheet .go,.sheet .row .go{background:var(--light);color:#201600;border-color:var(--light)}
.sheet .green,.sheet .row .green{background:var(--plant);color:#062A20;border-color:var(--plant)}
.sheet input[type=text]{width:100%;font:inherit;font-size:16px;background:var(--tile-lo);color:var(--text);border:1.5px solid var(--wire);border-radius:12px;padding:10px 12px;text-align:center}
.sharebox{width:100%;font:inherit;font-size:13px;background:var(--tile-lo);color:var(--text);border:1.5px solid var(--wire);border-radius:12px;padding:8px;resize:none;height:120px}
.board-list{width:100%;display:flex;flex-direction:column;gap:4px;text-align:left}
.board-list div{display:flex;gap:8px;align-items:center;background:var(--tile);border-radius:10px;padding:6px 10px;font-size:14px}
.board-list b{font-family:var(--f-display);font-weight:400;color:var(--light);min-width:24px}
.board-list span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-list em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
.board-list .me{outline:2px solid var(--light)}
.shop{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:var(--tile);border:1.5px solid var(--wire);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.item b{font-size:13px;line-height:1.2}
.item button{width:100%;border-radius:10px;border:0;padding:7px;font-weight:800;font-size:12.5px;background:var(--light);color:#201600}
.item button.own{background:var(--tile-lo);color:var(--text);border:1.5px solid var(--wire)}
.item button.on{background:var(--plant);color:#062A20}
.item button:disabled{opacity:.45}
.medals{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.medal{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:12px;padding:8px 10px}
.medal .m{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tile-lo);border:2px solid var(--wire);font-family:var(--f-display);font-size:15px;color:var(--wire)}
.medal.got .m{background:var(--light);border-color:#FFF1B8;color:#201600;box-shadow:0 0 14px rgba(255,210,63,.5)}
.medal b{display:block;font-size:14px}
.medal small{color:var(--dim);font-size:12.5px}
.medal:not(.got){opacity:.7}
.tip{position:absolute;left:16px;right:16px;bottom:88px;background:var(--text);color:#141A36;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;z-index:4;box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;text-align:left}
.tip svg{flex:none}
.flash{position:absolute;inset:0;background:#FFD23F;pointer-events:none;opacity:0;z-index:6}
.flash.go{animation:flash .6s}
.flash.storm{background:#CFE0FF}
@keyframes flash{15%{opacity:.35}100%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--plant);color:#062A20;font-weight:800;border-radius:99px;padding:8px 16px;z-index:70;font-size:14px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;animation:tin .3s}
.toast.gold{background:var(--light);color:#201600}
@keyframes tin{from{transform:translate(-50%,-12px);opacity:0}}
.rain{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s;background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(180,200,255,.16) 22px 23px);background-size:200px 200px;animation:rain .45s linear infinite}
.storming .rain{opacity:1}
@keyframes rain{to{background-position:-60px 200px}}
.storming .cell i{background:#7FB2FF}
.storming .cell.low i{background:var(--danger)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none;font-family:var(--f-display);font-size:110px;color:var(--light);text-shadow:0 0 30px rgba(255,210,63,.7);animation:cnt .8s forwards}
@keyframes cnt{from{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}to{opacity:0}}
.radio-wrap{position:fixed;inset:0;z-index:60;background:rgba(5,7,16,.72);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.radio{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:linear-gradient(to bottom,#1A1F3E,#0E1226);border:2px solid #3A4470;border-bottom:0;border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:12px;color:#EEF0FF;animation:rise .3s}
.radio-head{display:flex;align-items:center;gap:10px}
.radio-head b{font-family:var(--f-display);font-size:22px;color:#FFD23F;display:block;line-height:1}
.radio-head small{color:#9AA1C8;font-size:12.5px}
.radio-x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1.5px solid #3A4470;background:#141A36;color:#EEF0FF;font-size:16px}
.dial{position:relative;height:38px;border-radius:10px;background:#0A0D1C;border:1.5px solid #2A3260;overflow:hidden;background-image:repeating-linear-gradient(90deg,#2A3260 0 1px,transparent 1px 12px)}
.dial span{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--f-display);font-size:11px;color:#5A6390}
.dial span.on{color:#FFD23F}
.dial i{position:absolute;top:0;bottom:0;width:3px;background:#FF5D5D;box-shadow:0 0 10px #FF5D5D;transform:translateX(-50%);transition:left .4s}
.stations{display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:12px;text-align:left;background:#141A36;border:1.5px solid #2A3260;border-radius:14px;padding:10px 12px;color:#EEF0FF}
.st.on{border-color:#FFD23F;background:#1E2548}
.st .fq{font-family:var(--f-display);font-size:14px;color:#FFD23F;min-width:48px}
.st .nm{flex:1;min-width:0}.st b{display:block;font-size:15px}.st small{display:block;color:#9AA1C8;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}.eq i{width:4px;background:#3EE6B5;border-radius:2px;animation:eq .8s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.rrow{display:flex;gap:6px;flex-wrap:wrap}.rrow button{flex:1;min-height:42px;border-radius:12px;border:1.5px solid #3A4470;background:#141A36;color:#EEF0FF;font-weight:800;font-size:13px}
.rnote{margin:0;color:#9AA1C8;font-size:12.5px;line-height:1.4}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}
@media (prefers-reduced-motion:reduce){.rain,.count,.logo,.chispa-float,.node.current .dot,.cell.low i{animation:none}.flash.go{animation:none}}
</style>
</head><body>


<div class="app" id="app">
  <!-- Portada -->
  <section class="screen" id="sTitle">
    <div class="title-wrap">
      <div class="chispa-float" id="titleChispa"></div>
      <div class="logo">APAGÓN</div>
      <span class="ver">4.0</span>
      <p class="tag">Se fue la luz en Venezuela. Arregla postes y transformadores con Chispita, y viaja en moto de ciudad en ciudad para devolverle la luz a todo el país.</p>
      <button class="big" id="play" type="button">Jugar</button>
      <button class="big alt" id="dailyBtn" type="button">Reto del día<small id="dailyInfo">Nuevo cada día</small></button>
      <button class="big alt storm" id="stormBtn" type="button">Modo Tormenta<small id="stormInfo">Nuevo</small></button>
      <button class="big alt" id="worldBtn" type="button" style="border-color:var(--plant)">Mundo abierto<small style="color:var(--plant)" id="worldInfo">Camina y maneja por Upata</small></button>
      <button class="big alt moto" id="motoBtn" type="button">Viajes en moto<small id="motoInfo">Nuevo · de ciudad en ciudad</small></button>
      <div class="minirow">
        <button class="pillbtn" id="shopBtn" type="button">Tienda · <span class="bulbs" id="bulbsTitle"></span></button>
        <button class="pillbtn" id="medalsBtn" type="button">Medallas <span id="medalCount"></span></button>
        <button class="pillbtn" id="codeBtn" type="button">Tengo un reto</button>
      </div>
      <div class="minirow">
        <button class="pillbtn" id="sndTitle" type="button" aria-pressed="true">Sonido</button>
        <button class="pillbtn" id="musTitle" type="button" aria-pressed="true">Música</button>
      </div>
    </div>
    <svg class="skyline" id="skyTitle" viewBox="0 0 400 100" aria-hidden="true"></svg>
  </section>

  <!-- Mapa -->
  <section class="screen" id="sMap" hidden>
    <div class="head"><button class="icon" id="backTitle" type="button" aria-label="Volver">←</button><h1 id="mapTitle">Caracas</h1><span class="icon" id="starCount">0 ★</span></div>

  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(dest||actx.destination); o.start(t); o.stop(t+d+.03); }

      while(q.length){ const c=q.shift(); const t=tiles[c]; for(const [d,dx,dy,o] of DIRS){ if(!(t.sol&d)) continue; let x=t.x+dx,y=t.y+dy; let nb=y*cols+x; if(tiles[nb]&&tiles[nb].type==='bridge'){ x+=dx; y+=dy; nb=y*cols+x; } if(!tiles[nb]||dist.has(nb)) continue; dist.set(nb,dist.get(c)+1); q.push(nb); } }
      const cand=houses.filter(h=>h.owner===0&&dist.has(h.i)).sort((a,b)=>dist.get(b.i)-dist.get(a.i)); if(cand[0]) cand[0].type='hospital'; }
    const cand=tiles.filter(t=>t.type==='wire'&&t.sol!==5&&t.sol!==10); for(let f=0;f<(L.fixed||0)&&cand.length;f++){ const t=cand.splice(Math.floor(r()*cand.length),1)[0]; t.fixed=true; }
    tiles.forEach(t=>{ if(!MOVABLE(t)) return; const q=Math.floor(r()*4); t.r=q; t.turns=q; });
    const mov=tiles.filter(MOVABLE); const scr=mov.filter(t=>rot(t.sol,t.r)!==t.sol).length;
    if(scr<Math.ceil(mov.length*0.5)&&tries<500) continue;
    return {cols,rows,tiles,plants,two:!!L.two,fog:!!L.fog};
  }
}
const cur=t=>t.type==='bridge'?15:rot(t.sol,t.r);
function need(t){ if(!MOVABLE(t)) return 0; for(let k=0;k<4;k++) if(rot(cur(t),k)===t.sol) return k; return 0; }

function skyline(svg,w,h,seed,kind,lit){ const r=rng(seed); let x=0, html='', wins=[];
  const back=kind==='bridge'?`<rect x="0" y="${h*0.72}" width="${w}" height="${h*0.28}" fill="#1E1433"/>`
    :kind==='andes'?`<path d="M0 ${h*0.62} L${w*0.12} ${h*0.2} L${w*0.22} ${h*0.45} L${w*0.36} ${h*0.02} L${w*0.5} ${h*0.4} L${w*0.64} ${h*0.12} L${w*0.8} ${h*0.46} L${w*0.9} ${h*0.24} L${w} ${h*0.5} V${h} H0 Z" fill="#132A40"/><path d="M${w*0.36} ${h*0.02} L${w*0.33} ${h*0.12} L${w*0.39} ${h*0.1} Z M${w*0.64} ${h*0.12} L${w*0.61} ${h*0.2} L${w*0.67} ${h*0.2} Z M${w*0.12} ${h*0.2} L${w*0.1} ${h*0.28} L${w*0.14} ${h*0.27} Z" fill="#DDE8F5"/>`
    :kind==='guayana'?`<path d="M0 ${h*0.6} L${w*0.06} ${h*0.6} L${w*0.09} ${h*0.18} L${w*0.3} ${h*0.16} L${w*0.33} ${h*0.6} L${w*0.55} ${h*0.6} L${w*0.58} ${h*0.3} L${w*0.72} ${h*0.28} L${w*0.75} ${h*0.6} L${w} ${h*0.6} V${h} H0 Z" fill="#10302A"/><rect x="0" y="${h*0.74}" width="${w}" height="${h*0.26}" fill="#0F2F3A"/>`
    :`<path d="M0 ${h*0.5} Q ${w*0.25} ${h*0.05} ${w*0.5} ${h*0.32} T ${w} ${h*0.26} V ${h} H 0 Z" fill="#10163A"/>`;
  const bld=kind==='bridge'?'#2A1C45':kind==='andes'?'#17304A':kind==='guayana'?'#15352E':'#161D3D';
  while(x<w){ const bw=24+Math.floor(r()*36), bh=h*(kind==='bridge'?0.2:0.28)+r()*h*(kind==='bridge'?0.45:0.5), y=h-bh;
    html+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw-3}" height="${bh.toFixed(1)}" fill="${bld}"/>`;
    for(let wy=y+6;wy<h-5;wy+=9) for(let wx=x+5;wx<x+bw-9;wx+=8) wins.push([wx,wy]);
    x+=bw; }
  let front='';
  if(kind==='bridge'||kind==='guayana'){ const dy=h*0.64; front+=`<rect x="0" y="${dy}" width="${w}" height="3" fill="#3B2A5C"/>`;
    for(let px=30;px<w;px+=70){ front+=`<rect x="${px}" y="${dy-h*0.3}" width="4" height="${h*0.66}" fill="#3B2A5C"/><path d="M${px+2} ${dy-h*0.3} L${px-28} ${dy} M${px+2} ${dy-h*0.3} L${px+32} ${dy}" stroke="#3B2A5C" stroke-width="1.5"/>`; } }
  if(kind==='andes'){ front+=`<path d="M${w*0.05} ${h*0.55} L${w*0.36} ${h*0.06}" stroke="#6C8FB0" stroke-width="1" stroke-dasharray="3 3"/>`; }
  const rr=rng(seed+5); wins.sort(()=>rr()-.5);
  svg.innerHTML=back+html+front+wins.map(p=>`<rect class="sw" x="${p[0]}" y="${p[1].toFixed(1)}" width="4" height="4" rx="1" fill="#232B55"/>`).join('');
  svg._wins=[...svg.querySelectorAll('.sw')]; svg._lit=-1; setSky(svg,lit||0); }
function setSky(svg,ratio,stagger){ const ws=svg._wins; if(!ws) return; const n=Math.round(ws.length*ratio); const prev=svg._lit<0?0:svg._lit; svg._lit=n;
  ws.forEach((w,i)=>{ const col=i<n?(i%7===0?'#FFE9A8':'#FFB547'):'#232B55'; if(stagger&&i>=prev&&i<n) setTimeout(()=>w.setAttribute('fill',col),(i-prev)*6); else w.setAttribute('fill',col); }); }

  const label=new Date().toLocaleDateString('es',{day:'numeric',month:'long'});
  begin({L,city:CITIES[0],daily:true,key:'daily',seedCode:'d'+seed,sub:`Reto del ${label} · igual para todos`,tip:P.daily.done[todayKey()]?'Ya lo resolviste hoy. Puedes jugarlo otra vez para mejorar tu marca.':'Un barrio nuevo cada día, el mismo para todos. ¡Compara tu resultado!'}); }
function begin(o){
  closeModal(); stopStorm(); const g=generate(o.L,o.city.obst||['tree','cone','truck']);
  if(o.storm) g.tiles.forEach(t=>{ t.r=0; t.turns=0; });
  const min=g.tiles.reduce((a,t)=>a+need(t),0);
  const limit=(o.L.free||o.storm)?Infinity:min+Math.max(4,Math.ceil(min*0.6));
  const hosp=g.tiles.find(t=>t.type==='hospital');
  G={...o,...g,moves:0,min,limit,hints:o.daily?1:2,hintsUsed:0,done:false,lit:0,hist:[],recharged:false,timers:[],
    houses:g.tiles.filter(t=>t.type==='house'||t.type==='hospital').length, shorts:0,
    hosp:hosp?{i:hosp.i,deadline:limit===Infinity?Infinity:Math.floor(limit/2),litAt:null,late:false}:null, won:false, t0:performance.now()};
  G.tiles.forEach(t=>{ t.ang=-t.turns*Math.PI/2; t.vis=null; t.visV=null; t.visH=null; t.litVis=false; t.loose=new Set(); t.fogA=G.fog?1:0; t.revealed=!G.fog; t.popT=0; });
  if(G.fog) G.plants.forEach(p=>revealAround(G.tiles[p]));
  $('#app').classList.toggle('storming',!!o.storm); $('#controls').hidden=!!o.storm;
  $('#lvName').textContent=o.L.name; $('#lvSub').textContent=o.sub;
  skyline($('#sky'),400,46,o.L.seed,o.city.skyline||'avila',0);
  show('sGame'); fitView(); power(false); updateHud(); zoomIn=0;
  if(o.tip) setTimeout(()=>showTip(o.tip),450);
  if(o.storm) stormStart();
  MUS.storm=!!o.storm;
}
function revealAround(t){ t.revealed=true; for(const [,dx,dy] of DIRS){ const x=t.x+dx,y=t.y+dy; if(x>=0&&y>=0&&x<G.cols&&y<G.rows) G.tiles[y*G.cols+x].revealed=true; } }

/* consejo de Chispita */
function showTip(t){ const tip=$('#tip'); tip.innerHTML=`${chispa('happy',40)}<span>${t}</span>`; tip.hidden=false; clearTimeout(showTip.tm); showTip.tm=setTimeout(hideTip,9000); }
function hideTip(){ $('#tip').hidden=true; }
$('#tip').onclick=hideTip;

/* ---------- Tocar ---------- */
function tapTile(i){
  if(!G||G.done) return; ensureAudio(); hideTip(); const t=G.tiles[i]; if(!t) return;
  if(G.storm&&!G.running) return;
  if(!t.revealed){ toast('Hay neblina: lleva la luz cerca para despejarla'); sfx.clank(); return; }
  if(t.type==='plant'){ sfx.hum(); t.popT=performance.now(); return; }
  if(t.type==='block'){ sfx.clank(); t.shakeT=performance.now(); return; }
  if(t.type==='bridge'){ sfx.clank(); t.shakeT=performance.now(); toast('Los puentes no giran'); return; }
  if(t.fixed){ sfx.clank(); t.shakeT=performance.now(); vib(15); return; }
  t.r=(t.r+1)%4; t.turns++; t.tapT=performance.now(); t.hint=false;
  G.moves++; if(!G.storm) G.hist.push(t.i); sfx.turn(); vib(8); power(true); updateHud(); check();
}
$('#undo').onclick=()=>{ if(!G||G.done||!G.hist.length) return; const t=G.tiles[G.hist.pop()]; t.r=(t.r+3)%4; t.turns--; G.moves--; sfx.undo(); power(true); updateHud(); };
$('#restart').onclick=()=>{ if(!G) return; sfx.click(); begin({L:G.L,city:G.city,ci:G.ci,li:G.li,key:G.key,sub:G.sub,daily:G.daily,seedCode:G.seedCode,challenge:G.challenge,world:G.world}); };
$('#hint').onclick=()=>{
  if(!G||G.done||G.hints<=0) return;
  const wrong=G.tiles.filter(t=>t.revealed&&need(t)>0); if(!wrong.length){ toast('Despeja más neblina para recibir pistas'); return; }
  wrong.sort((a,b)=>Number(nearOn(b))-Number(nearOn(a)));
  const t=wrong[0]; const k=need(t); t.r=(t.r+k)%4; t.turns+=k; t.hint=true; t.tapT=performance.now();
  G.hints--; G.hintsUsed++; sfx.hint(); power(true); updateHud(); check();
};
function nearOn(t){ return DIRS.some(([,dx,dy])=>{ const x=t.x+dx,y=t.y+dy; return x>=0&&y>=0&&x<G.cols&&y<G.rows&&G.tiles[y*G.cols+x].col!=null; }); }

/* ---------- Corriente: se calcula por color y viaja cable por cable ---------- */
function power(animate){
  const T=G.tiles, cols=G.cols, rows=G.rows;
  const reach=T.map(()=>[null,null]); const bax=new Map();
  G.plants.forEach((p,pi)=>{ reach[p][pi]=0; const q=[p];
    while(q.length){ const c=q.shift(), t=T[c], m=cur(t), dep=reach[c][pi];
      for(const [d,dx,dy,o] of DIRS){ if(!(m&d)) continue; const x=t.x+dx,y=t.y+dy; if(x<0||y<0||x>=cols||y>=rows) continue; const nb=y*cols+x, tn=T[nb];
        if(tn.type==='block') continue;
        if(tn.type==='bridge'){ const x2=x+dx,y2=y+dy; if(x2<0||y2<0||x2>=cols||y2>=rows) continue; const m2=y2*cols+x2, t2=T[m2]; if(t2.type==='block'||t2.type==='bridge') continue;
          if(cur(t2)&o){ const ax=(d===N||d===S)?'v':'h'; const b=bax.get(nb)||{v:[null,null],h:[null,null]}; if(b[ax][pi]==null) b[ax][pi]=dep+1; bax.set(nb,b); if(reach[m2][pi]==null){ reach[m2][pi]=dep+2; q.push(m2); } } }
        else if((cur(tn)&o)&&reach[nb][pi]==null){ reach[nb][pi]=dep+1; q.push(nb); } } } });
  let lit=0, shorts=0; const colOf=rr=>{ const a=rr[0]!=null, b=rr[1]!=null; return a&&b?'short':a?0:b?1:null; };
  T.forEach((t,i)=>{ if(t.type==='block') return;
    if(t.type==='bridge'){ const b=bax.get(i)||{v:[null,null],h:[null,null]}; t.colV=colOf(b.v); t.colH=colOf(b.h); t.col=t.colV!=null||t.colH!=null?(t.colV??t.colH):null;
      t.depth=Math.min(...[...b.v,...b.h].filter(v=>v!=null),99); if(t.colV==='short'||t.colH==='short') shorts++; return; }
    t.col=colOf(reach[i]); t.depth=Math.min(...reach[i].filter(v=>v!=null),99); if(t.col==='short') shorts++;
    t.lit=(t.type==='house'||t.type==='hospital')&&t.col===(G.two?t.owner:0); if(t.lit) lit++; });
  // extremos sueltos
  T.forEach(t=>{ t.loose=new Set(); if(t.type==='block') return; const m=t.type==='bridge'?15:t.sol;
    for(const d of [1,2,4,8]){ if(!(m&d)) continue; const w=t.type==='bridge'?d:rot(d,t.r); const [dx,dy]=STEP[w]; const x=t.x+dx,y=t.y+dy;
      const tn=(x>=0&&y>=0&&x<cols&&y<rows)?T[y*cols+x]:null; const ok=tn&&tn.type!=='block'&&(tn.type==='bridge'||(cur(tn)&OPP[w])); if(!ok) t.loose.add(d); } });
  // neblina
  if(G.fog) T.forEach(t=>{ if(t.col!=null) revealAround(t); });
  // animación: la luz viaja desde las subestaciones
  G.timers.forEach(clearTimeout); G.timers=[];
  const pending=T.filter(t=>t.type!=='block'&&(t.col!==t.vis||t.colV!==t.visV||t.colH!==t.visH||t.lit!==t.litVis));
  const onDepths=pending.filter(t=>t.col!=null).map(t=>t.depth); const base=onDepths.length?Math.min(...onDepths):0;
  let maxDelay=0, houseOrder=0, anyShort=false;
  pending.forEach(t=>{ const delay=(animate&&!reduce&&t.col!=null)?Math.max(0,(t.depth-base))*55:0; maxDelay=Math.max(maxDelay,delay);
    const apply=()=>{ const wasLit=t.litVis; t.vis=t.col; t.visV=t.colV; t.visH=t.colH; t.litVis=!!t.lit;
      if(t.litVis&&!wasLit){ t.popT=performance.now(); if(animate) sfx.house(houseOrder++); }
      else if(animate&&t.col!=null&&t.col!=='short'&&Math.random()<.3) sfx.zap(); };
    if(t.col==='short'||t.colV==='short'||t.colH==='short') anyShort=true;
    if(delay) G.timers.push(setTimeout(apply,delay)); else apply(); });
  if(anyShort&&animate&&shorts>(G.shorts||0)){ sfx.short(); vib(40); toast('¡Cortocircuito! Separa los cables de colores'); }
  G.lit=lit; G.shorts=shorts; G.lightDelay=maxDelay; setSky($('#sky'),lit/G.houses,true);
  if(G.hosp){ const h=T[G.hosp.i]; if(h.lit&&G.hosp.litAt==null){ G.hosp.litAt=G.moves; if(G.moves>G.hosp.deadline) G.hosp.late=true; else if(animate){ toast('¡El hospital tiene luz a tiempo!'); award('hospital'); } } }
}
function updateHud(){
  if(G.storm){ const p=Math.max(0,G.patience??100); $('#cellFill').style.width=p+'%'; $('#cell').classList.toggle('low',p<30);
    $('#battTxt').textContent='Paciencia del barrio'; $('#status').innerHTML=`<b>${Math.floor(G.score||0).toLocaleString('es')}</b> puntos · ${fmtTime(G.elapsed||0)} · ${G.lit}/${G.houses} casas`; return; }
  const left=G.limit===Infinity?null:Math.max(0,G.limit-G.moves);
  const pct=left==null?100:left/G.limit*100;
  $('#cellFill').style.width=pct+'%'; $('#cell').classList.toggle('low',left!=null&&pct<22);
  $('#battTxt').textContent=left==null?'Batería llena':`${left} giros de batería`;
  let s;
  if(G.two){ const hs=G.tiles.filter(t=>t.type==='house'||t.type==='hospital'); const a=hs.filter(h=>h.owner===0), b=hs.filter(h=>h.owner===1);
    s=`<b>${a.filter(h=>h.lit).length}/${a.length}</b> amarillas · <b class="bl">${b.filter(h=>h.lit).length}/${b.length}</b> azules · ${G.moves} giros`; }

  $('#status').innerHTML=s;

}
function starsFor(){ let s; if(G.L.free) s=G.moves<=G.min+2?3:G.moves<=G.min+6?2:1;
  else if(G.moves<=G.min+Math.ceil(G.min*0.15)+1) s=3; else if(G.moves<=G.min+Math.ceil(G.min*0.35)+2) s=2; else s=1;
  if(G.hosp&&(G.hosp.late||G.hosp.litAt==null)) s=Math.min(s,2); return s; }
function check(){

}

/* ======================= Motor 3D de la calle (canvas isométrico propio) ======================= */
const cv=$('#cv'), ctx=cv.getContext('2d');
const V={S:40,ox:0,oy:0,k:0.3,K:0.62,H:0.95,w:0,h:0};
let zoomIn=1;
function fitView(){ const wrap=$('#boardWrap'); const w=wrap.clientWidth, h=wrap.clientHeight; if(!w||!h||!G) return; const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); V.w=w; V.h=h;
  // la cámara se inclina más o menos según el espacio, para que el barrio llene la pantalla
  V.k=0.2; const top=1.45*V.H;
  let S=w/(G.cols+G.rows*V.k+0.5);
  let K=(h/S-top-0.45)/G.rows; K=Math.max(0.55,Math.min(0.92,K));
  if((G.rows*K+top+0.45)*S>h) S=h/(G.rows*K+top+0.45);
  V.S=S; V.K=K; const bh=G.rows*K+top+0.45;
  V.ox=(w-(G.cols+G.rows*V.k)*V.S)/2; V.oy=(h-bh*V.S)/2+top*V.S+0.1*V.S; }
new ResizeObserver(()=>fitView()).observe($('#boardWrap'));
const PJ=(x,y,z)=>[V.ox+(x+z*V.k)*V.S, V.oy+z*V.K*V.S-y*V.H*V.S];
function hexRGB(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function shade(h,f){ const [r,g,b]=hexRGB(h); const c=v=>Math.max(0,Math.min(255,Math.round(v*f))); return `rgb(${c(r)},${c(g)},${c(b)})`; }
function poly(pts,fill,stroke,lw){ ctx.beginPath(); pts.forEach((p,i)=>{ const [sx,sy]=PJ(p[0],p[1],p[2]); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); }); ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
// caja: se ven la cara de arriba, la del frente (+z) y la del oeste (-x)
function box(x0,x1,z0,z1,y0,y1,col,edge){ poly([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],shade(col,.62),edge,1); poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],shade(col,.8),edge,1); poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],shade(col,1.05),edge,1); }
function line3(a,b,col,w,cap='round'){ const [x0,y0]=PJ(...a), [x1,y1]=PJ(...b); ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap=cap; ctx.stroke(); }
function circ(p,r,fill,stroke,lw){ const [sx,sy]=PJ(...p); ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); if(fill){ ctx.fillStyle=fill; ctx.fill(); } if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); } }
function glowDot(p,r,rgb,a){ const [sx,sy]=PJ(...p); const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r); g.addColorStop(0,`rgba(${rgb},${a})`); g.addColorStop(1,`rgba(${rgb},0)`); ctx.fillStyle=g; ctx.fillRect(sx-r,sy-r,r*2,r*2); }
function shadowEl(cx,cz,rx,rz,a=.35){ const [sx,sy]=PJ(cx,0.071,cz); ctx.beginPath(); ctx.ellipse(sx,sy,rx*V.S,rz*V.S*V.K,0,0,Math.PI*2); ctx.fillStyle=`rgba(0,0,0,${a})`; ctx.fill(); }

const COL={on:['#FFD23F','#46C8FF'],onRGB:['255,210,63','70,200,255'],off:'#4A5480',short:'#FF4D4D'};
const HOUSE_WALLS=['#F4A7B9','#9AD1F5','#FFD98A','#B9E6A8','#F7C59F','#C9B6F2','#8FE0D2','#FFB3A7'];
const DV={1:[0,-1],2:[1,0],4:[0,1],8:[-1,0]};
function armVec(d,a){ const [vx,vz]=DV[d]; const c=Math.cos(a), s=Math.sin(a); return [vx*c-vz*s, vx*s+vz*c]; }
const colorOf=v=>v==='short'?COL.short:v===0||v===1?COL.on[v]:COL.off;

function drawCable(a,b,v,t,tNow){ const w=Math.max(2,0.075*V.S);
  if(v!=null){ const rgb=v==='short'?'255,77,77':COL.onRGB[v]; line3(a,b,`rgba(${rgb},.28)`,w*3.2); }
  line3(a,b,'rgba(0,0,0,.35)',w+2); line3(a,b,colorOf(v),w);
  if(v!=null&&v!=='short'&&!reduce){ ctx.save(); ctx.setLineDash([0.1*V.S,0.22*V.S]); ctx.lineDashOffset=-tNow*0.05; line3(a,b,'rgba(255,250,220,.85)',Math.max(1,w*0.35)); ctx.restore(); } }
function drawPlug(p,powered,tNow){ const r=Math.max(2.5,0.055*V.S);
  circ(p,r,'#0B0F1E',powered?'#FFD2D2':'#6B75A8',2);
  if(powered&&!reduce){ const [sx,sy]=PJ(...p); ctx.strokeStyle=(Math.floor(tNow/80)%2)?'#FFD23F':'#fff'; ctx.lineWidth=1.6; ctx.beginPath();
    for(let i=0;i<5;i++){ const a=Math.random()*Math.PI*2, l=r*(1.6+Math.random()*2); ctx.moveTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r); ctx.lineTo(sx+Math.cos(a)*l,sy+Math.sin(a)*l); } ctx.stroke(); } }

function drawArms(t,cx,cz,h0,tNow){ const m=t.type==='bridge'?15:t.sol;
  for(const d of [1,2,4,8]){ if(!(m&d)) continue;
    const bridgeUp=t.type==='bridge'&&(d===2||d===8);
    const [vx,vz]=t.type==='bridge'?DV[d]:armVec(d,t.ang);
    const start=[cx,bridgeUp?1.32:h0,cz], end=[cx+vx*0.5,0.95,cz+vz*0.5];
    const v=t.type==='bridge'?(bridgeUp?t.visH:t.visV):t.vis;
    drawCable(start,end,v,t,tNow);
    if(t.loose.has(d)) drawPlug([cx+vx*0.44,0.95,cz+vz*0.44],v!=null,tNow); } }

function drawPole(t,cx,cz,top,tNow){ const fixed=t.fixed, pc=fixed?'#E0B02A':'#9AA0B8';
  shadowEl(cx+0.05,cz+0.05,0.12,0.12,.3);
  if(fixed){ box(cx-0.1,cx+0.1,cz-0.1,cz+0.1,0.07,0.1,'#3A3F55'); [[-.07,-.07],[.07,-.07],[-.07,.07],[.07,.07]].forEach(([a,b])=>circ([cx+a,0.105,cz+b],Math.max(1,0.012*V.S),'#C9CEDF')); }
  box(cx-0.035,cx+0.035,cz-0.035,cz+0.035,0.07,top,pc);
  if(fixed){ for(let y=0.2;y<top-0.1;y+=0.2) box(cx-0.036,cx+0.036,cz-0.036,cz+0.036,y,y+0.07,'#1B1F33'); }
  box(cx-0.15,cx+0.15,cz-0.025,cz+0.025,top-0.07,top-0.03,'#6B7390');
  if(t.type==='wire'&&bits(t.sol)>=3){ const on=t.vis!=null&&t.vis!=='short';
    box(cx-0.2,cx-0.06,cz-0.06,cz+0.07,0.55,0.8,t.vis==='short'?'#8A3A3A':'#5E6B7A');
    circ([cx-0.13,0.83,cz],Math.max(2,0.03*V.S),on?COL.on[t.vis]:'#2A3050');
    if(on) glowDot([cx-0.13,0.8,cz],0.3*V.S,COL.onRGB[t.vis],.35+0.15*Math.sin(tNow/180)); } }

function drawHouse(t,cx,cz,tNow){ const hosp=t.type==='hospital'; const pop=Math.max(0,1-(tNow-t.popT)/450); const bump=1+Math.sin(pop*Math.PI)*0.12;
  if(hosp){ const h=0.62*bump; shadowEl(cx+0.04,cz+0.05,0.36,0.32);
    box(cx-0.3,cx+0.3,cz-0.26,cz+0.26,0.07,h,'#F2F4FA');
    const lit=t.litVis; const wc=lit?'#BFE6FF':'#2A3358';
    for(let i=0;i<3;i++){ const x=cx-0.24+i*0.17; poly([[x,0.3,cz+0.261],[x+0.1,0.3,cz+0.261],[x+0.1,0.42,cz+0.261],[x,0.42,cz+0.261]],wc); }
    poly([[cx-0.03,0.45,cz+0.262],[cx+0.03,0.45,cz+0.262],[cx+0.03,0.57,cz+0.262],[cx-0.03,0.57,cz+0.262]],'#E23B3B'); poly([[cx-0.08,0.48,cz+0.262],[cx+0.08,0.48,cz+0.262],[cx+0.08,0.54,cz+0.262],[cx-0.08,0.54,cz+0.262]],'#E23B3B');
    poly([[cx-0.1,h+0.001,cz-0.1],[cx+0.1,h+0.001,cz-0.1],[cx+0.1,h+0.001,cz+0.1],[cx-0.1,h+0.001,cz+0.1]],'#E23B3B');
    if(lit) glowDot([cx,0.36,cz+0.3],0.5*V.S,'170,220,255',.25);
    line3([cx,h,cz],[cx,0.95,cz],'#6B7390',Math.max(1.5,0.03*V.S)); return; }
  const wall=HOUSE_WALLS[t.look%HOUSE_WALLS.length], roof=['#C0564A','#8E4A3A','#B8664A','#6E5A8E'][t.look%4];
  const y1=0.46*bump, apex=0.72*bump;
  shadowEl(cx+0.04,cz+0.05,0.32,0.28);
  box(cx-0.26,cx+0.26,cz-0.22,cz+0.24,0.07,y1,wall);
  const lit=t.litVis; const wc=lit?'#FFC65C':'#1E2548';
  [[cx-0.19,cx-0.07],[cx+0.07,cx+0.19]].forEach(([a,b])=>poly([[a,0.24,cz+0.241],[b,0.24,cz+0.241],[b,0.37,cz+0.241],[a,0.37,cz+0.241]],wc,'#141A36',1));
  poly([[cx-0.04,0.07,cz+0.242],[cx+0.04,0.07,cz+0.242],[cx+0.04,0.26,cz+0.242],[cx-0.04,0.26,cz+0.242]],'#5A3A2A');
  poly([[cx-0.261,0.24,cz-0.1],[cx-0.261,0.24,cz+0.02],[cx-0.261,0.36,cz+0.02],[cx-0.261,0.36,cz-0.1]],wc);
  const ap=[cx,apex,cz+0.01], b0=[cx-0.3,y1,cz-0.26], b1=[cx+0.3,y1,cz-0.26], b2=[cx+0.3,y1,cz+0.28], b3=[cx-0.3,y1,cz+0.28];
  poly([b0,b1,ap],shade(roof,.9)); poly([b1,b2,ap],shade(roof,.7)); poly([b3,b0,ap],shade(roof,.6)); poly([b2,b3,ap],shade(roof,1));
  if(lit) glowDot([cx,0.3,cz+0.3],0.45*V.S,'255,190,90',.28+0.08*Math.sin(tNow/300+t.i));
  line3([cx,apex,cz],[cx,0.95,cz],'#6B7390',Math.max(1.5,0.03*V.S));
  if(G.two){ const c=COL.on[t.owner]; circ([cx,0.98,cz],Math.max(3,0.06*V.S),lit?c:shade(c,.45),'#141A36',1.5); if(lit) glowDot([cx,0.98,cz],0.25*V.S,COL.onRGB[t.owner],.5); } }

function drawPlant(t,cx,cz,tNow){ const col=G.two?['#3EE6B5','#46C8FF'][t.plantIdx]:'#3EE6B5', rgb=G.two?['62,230,181','70,200,255'][t.plantIdx]:'62,230,181';
  const pulse=(tNow/1400)%1; const [sx,sy]=PJ(cx,0.08,cz); ctx.beginPath(); ctx.ellipse(sx,sy,(0.2+pulse*0.4)*V.S,(0.2+pulse*0.4)*V.S*V.K,0,0,Math.PI*2); ctx.strokeStyle=`rgba(${rgb},${0.6*(1-pulse)})`; ctx.lineWidth=2; ctx.stroke();
  box(cx-0.4,cx+0.4,cz-0.4,cz+0.4,0.07,0.1,'#1E3A34');
  box(cx-0.33,cx-0.13,cz+0.08,cz+0.3,0.1,0.34,'#7C8AA0'); box(cx+0.13,cx+0.33,cz+0.08,cz+0.3,0.1,0.34,'#7C8AA0');
  circ([cx-0.23,0.4,cz+0.19],Math.max(2,0.035*V.S),'#C9CEDF'); circ([cx+0.23,0.4,cz+0.19],Math.max(2,0.035*V.S),'#C9CEDF');
  const L=[[cx-0.14,0.1,cz-0.02],[cx-0.03,0.95,cz]], R=[[cx+0.14,0.1,cz-0.02],[cx+0.03,0.95,cz]];
  line3(L[0],L[1],'#B8C0D8',2); line3(R[0],R[1],'#B8C0D8',2); for(let y=0.25;y<0.9;y+=0.18){ const f=(y-0.1)/0.85; line3([cx-0.14+0.11*f,y,cz],[cx+0.14-0.11*f,y,cz],'#8C94B0',1.2); }
  for(const x of [cx-0.4,cx+0.4]) line3([x,0.1,cz-0.4],[x,0.1,cz+0.4],'#8C94B0',1); line3([cx-0.4,0.26,cz+0.4],[cx+0.4,0.26,cz+0.4],'#8C94B0',1); line3([cx-0.4,0.26,cz-0.4],[cx-0.4,0.26,cz+0.4],'#8C94B0',1);
  circ([cx,0.98,cz],Math.max(4,0.08*V.S),col,'#141A36',2); glowDot([cx,0.98,cz],0.45*V.S,rgb,.45+0.2*Math.sin(tNow/250)); }

function drawObstacle(t,cx,cz,tNow){ const k=t.obst;
  if(k==='tree'){ shadowEl(cx+0.05,cz+0.06,0.28,0.25); box(cx-0.035,cx+0.035,cz-0.035,cz+0.035,0.07,0.36,'#6B4A2B'); circ([cx,0.58,cz],0.27*V.S,'#2F8F5B'); circ([cx-0.12,0.5,cz+0.05],0.17*V.S,'#3FA46A'); circ([cx+0.12,0.52,cz+0.03],0.16*V.S,'#2A7F50'); circ([cx-0.05,0.7,cz],0.08*V.S,'rgba(120,220,150,.5)'); }
  else if(k==='palm'){ shadowEl(cx+0.05,cz+0.06,0.3,0.2); const pts=[[cx,0.07,cz],[cx+0.03,0.35,cz],[cx+0.08,0.65,cz]]; line3(pts[0],pts[1],'#8B5E3C',0.07*V.S); line3(pts[1],pts[2],'#8B5E3C',0.06*V.S);
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+0.3; const e=[cx+0.08+Math.cos(a)*0.32,0.5+Math.sin(i)*0.05,cz+Math.sin(a)*0.25]; line3(pts[2],e,'#2F8F5B',0.05*V.S); } circ(pts[2],0.04*V.S,'#6B4A2B'); }
  else if(k==='frailejon'){ shadowEl(cx+0.04,cz+0.05,0.22,0.2); box(cx-0.05,cx+0.05,cz-0.05,cz+0.05,0.07,0.34,'#6E6A5A'); for(let i=0;i<7;i++){ const a=i/7*Math.PI*2; circ([cx+Math.cos(a)*0.12,0.42,cz+Math.sin(a)*0.1],0.09*V.S,'#A9B89A'); } circ([cx,0.47,cz],0.1*V.S,'#C3D1B4'); [[-.06,.56],[.07,.58],[0,.62]].forEach(([dx,y])=>circ([cx+dx,y,cz],0.03*V.S,'#FFD23F')); }
  else if(k==='truck'){ const blink=Math.floor(tNow/400)%2;
    shadowEl(cx+0.03,cz+0.05,0.42,0.22);
    box(cx-0.38,cx+0.38,cz-0.16,cz+0.16,0.12,0.2,'#2B2F44');
    box(cx-0.38,cx-0.12,cz-0.15,cz+0.15,0.2,0.47,'#F4F5F8');
    poly([[cx-0.381,0.32,cz-0.12],[cx-0.381,0.32,cz+0.12],[cx-0.381,0.44,cz+0.12],[cx-0.381,0.44,cz-0.12]],'#7FB2E0');
    box(cx-0.1,cx+0.38,cz-0.15,cz+0.15,0.2,0.34,'#F28C28');
    poly([[cx-0.1,0.25,cz+0.151],[cx+0.38,0.25,cz+0.151],[cx+0.38,0.28,cz+0.151],[cx-0.1,0.28,cz+0.151]],'#fff');
    line3([cx+0.26,0.36,cz],[cx-0.02,0.82,cz],'#9AA0B8',0.05*V.S); line3([cx+0.26,0.36,cz],[cx+0.18,0.62,cz],'#6B7390',0.04*V.S);
    box(cx-0.12,cx+0.04,cz-0.07,cz+0.07,0.74,0.88,'#FFC21A');
    for(const x of [cx-0.26,cx+0.24]){ circ([x,0.12,cz+0.17],0.07*V.S,'#11131C','#6B7390',1.5); }
    circ([cx-0.25,0.5,cz],0.035*V.S,blink?'#FFB020':'#6B4A10'); if(blink) glowDot([cx-0.25,0.5,cz],0.3*V.S,'255,176,32',.45); }
  else { shadowEl(cx+0.03,cz+0.04,0.16,0.14); box(cx-0.14,cx+0.14,cz-0.14,cz+0.14,0.07,0.1,'#E05A1A'); poly([[cx-0.1,0.1,cz+0.1],[cx+0.1,0.1,cz+0.1],[cx,0.52,cz]],'#FF7A2F'); poly([[cx-0.1,0.1,cz-0.1],[cx-0.1,0.1,cz+0.1],[cx,0.52,cz]],'#D8601F'); poly([[cx-0.062,0.27,cz+0.063],[cx+0.062,0.27,cz+0.063],[cx+0.045,0.35,cz+0.045],[cx-0.045,0.35,cz+0.045]],'#fff'); } }

function drawTile(t,tNow){ const x=t.x, z=t.y, cx=x+0.5, cz=z+0.5;
  // animación de giro
  const target=-t.turns*Math.PI/2; if(reduce) t.ang=target; else t.ang+=(target-t.ang)*0.3; if(Math.abs(target-t.ang)<0.002) t.ang=target;
  const shake=t.shakeT&&tNow-t.shakeT<300?Math.sin((tNow-t.shakeT)/25)*0.03:0;
  const cxs=cx+shake;
  let walk=t.type==='plant'?'#1E3A34':t.type==='hospital'?'#3C4468':t.fixed?'#3A3A2E':'#2A3159';
  const tapped=t.tapT&&tNow-t.tapT<220;
  box(x+0.06,x+0.94,z+0.06,z+0.94,0,0.07,tapped?'#3A4A86':t.hint?'#3E4A7A':walk);
  if(t.type==='block'){ drawObstacle(t,cxs,cz,tNow); }
  else if(t.type==='plant'){ drawPlant(t,cxs,cz,tNow); drawArms(t,cxs,cz,0.95,tNow); }
  else if(t.type==='house'||t.type==='hospital'){ drawHouse(t,cxs,cz,tNow); drawArms(t,cxs,cz,0.95,tNow); }
  else if(t.type==='bridge'){ shadowEl(cxs+0.05,cz+0.05,0.14,0.14,.3); box(cxs-0.045,cxs+0.045,cz-0.045,cz+0.045,0.07,1.34,'#8C94B0'); box(cxs-0.035,cxs+0.035,cz-0.2,cz+0.2,1.28,1.33,'#6B7390'); box(cxs-0.15,cxs+0.15,cz-0.025,cz+0.025,0.9,0.94,'#6B7390'); drawArms(t,cxs,cz,0.95,tNow); }
  else { drawPole(t,cxs,cz,1.0,tNow); drawArms(t,cxs,cz,0.95,tNow); }
  // neblina
  if(G.fog){ if(t.revealed&&t.fogA>0) t.fogA=Math.max(0,t.fogA-0.05); if(t.fogA>0){ const a=t.fogA;
      for(let i=0;i<5;i++){ const ox=Math.sin(t.i*3.1+i*1.7+tNow/1800)*0.18, oz=Math.cos(t.i*2.3+i)*0.15; circ([cx+ox,0.45+i*0.09,cz+oz],(0.3-i*0.02)*V.S,`rgba(205,220,235,${0.55*a})`); } } }
}

// partículas en pantalla: fuegos artificiales y rayos
const FX=[]; const BOLTS=[];
function fireworks(){ if(reduce) return; for(let b=0;b<6;b++) setTimeout(()=>{ if(!G) return; const x=V.ox+Math.random()*(G.cols*V.S), y=V.oy-V.S*(0.6+Math.random()*1.2); const col=['#FFD23F','#46C8FF','#3EE6B5','#FF5D5D','#EEF0FF'][b%5];
    for(let i=0;i<34;i++){ const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3.2; FX.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col}); } tone(200+Math.random()*200,.25,'sine',.03,0,60); },b*280); }

let lastT=0;
function frame(tNow){
  requestAnimationFrame(frame);
  if(!G||$('#sGame').hidden||!V.w) return;
  ctx.clearRect(0,0,V.w,V.h);
  if(zoomIn<1) zoomIn=Math.min(1,zoomIn+0.04);
  ctx.save(); const z=0.9+0.1*(1-Math.pow(1-zoomIn,3)); ctx.translate(V.w/2,V.h/2); ctx.scale(z,z); ctx.translate(-V.w/2,-V.h/2);
  // base: calles
  box(-0.15,G.cols+0.15,-0.15,G.rows+0.15,-0.28,0,'#161B33');
  ctx.save(); ctx.setLineDash([Math.max(3,0.12*V.S),Math.max(3,0.12*V.S)]);
  for(let i=1;i<G.cols;i++) line3([i,0.002,0],[i,0.002,G.rows],'rgba(255,210,63,.35)',1.2,'butt');
  for(let j=1;j<G.rows;j++) line3([0,0.002,j],[G.cols,0.002,j],'rgba(255,210,63,.35)',1.2,'butt');
  ctx.restore();
  for(let z0=0;z0<G.rows;z0++) for(let x0=G.cols-1;x0>=0;x0--) drawTile(G.tiles[z0*G.cols+x0],tNow);
  // rayos
  for(let i=BOLTS.length-1;i>=0;i--){ const b=BOLTS[i]; const age=tNow-b.t0; if(age>320){ BOLTS.splice(i,1); continue; }
    const [ex,ey]=PJ(b.x,1.1,b.z); ctx.save(); ctx.globalAlpha=age<60||(age>120&&age<180)?1:0.5; ctx.strokeStyle='#fff'; ctx.shadowColor='#9FC4FF'; ctx.shadowBlur=16; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(ex+b.off[0]*30,-10);
    b.off.forEach((o,k)=>{ const f=(k+1)/b.off.length; ctx.lineTo(ex+o*30*(1-f),-10+(ey+10)*f); }); ctx.stroke(); ctx.restore(); }
  for(let i=FX.length-1;i>=0;i--){ const p=FX[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.018; if(p.life<=0){ FX.splice(i,1); continue; } ctx.globalAlpha=p.life; ctx.fillStyle=p.col; ctx.fillRect(p.x-1.5,p.y-1.5,3,3); ctx.globalAlpha=1; }
  ctx.restore();
}
requestAnimationFrame(frame);
function pick(px,py){ if(!G) return -1; const z=0.9+0.1*(1-Math.pow(1-zoomIn,3)); px=(px-V.w/2)/z+V.w/2; py=(py-V.h/2)/z+V.h/2;
  for(const yg of [0.45,0.15,0.8]){ const zz=(py-V.oy+yg*V.H*V.S)/(V.K*V.S); const xx=(px-V.ox)/V.S-V.k*zz; const ix=Math.floor(xx), iz=Math.floor(zz);
    if(ix>=0&&iz>=0&&ix<G.cols&&iz<G.rows){ const t=G.tiles[iz*G.cols+ix]; if(yg!==0.45||t.type!=='block') return t.i; } }
  return -1; }
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(); const i=pick(e.clientX-r.left,e.clientY-r.top); if(i>=0) tapTile(i); });

const get=(x,y,z)=>(x<0||z<0||x>=WX||z>=WZ||y<0||y>=WY)?0:B[bi(x,y,z)];
const setB=(x,y,z,v)=>{ if(x<0||z<0||x>=WX||z>=WZ||y<0||y>=WY) return; B[bi(x,y,z)]=v; };
const solid=(x,y,z)=>{ if(y<0) return true; if(x<0||z<0||x>=WX||z>=WZ) return true; if(y>=WY) return false; return B[bi(x,y,z)]!==0; };
function hash(x,z,s=0){ let h=(x*374761393+z*668265263+s*982451653)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,z){ const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi; const s=t=>t*t*(3-2*t);
  const a=hash(xi,zi,7), b=hash(xi+1,zi,7), c=hash(xi,zi+1,7), d=hash(xi+1,zi+1,7); const u=s(xf), v=s(zf); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }

const GL=6; // la superficie del pueblo está en y=6
const ROADS=[20,34,48,62,76,90];
const inRoad=v=>ROADS.some(r=>v>=r&&v<=r+2);
const MZ=[[23,33],[37,47],[51,61],[65,75],[79,89]]; // manzanas
function groundH(x,z){
  if(z>=59&&z<=67&&x>=90) return GL; // carretera hacia Puerto Ordaz
  const d=Math.max(0,12-x,x-100,12-z,z-100);
  if(d<=0) return GL;
  return GL+Math.min(24,Math.floor(d*0.95+vnoise(x*0.09,z*0.09)*7*Math.min(1,d/4)));
}

const WORLD={windows:[],lamps:[],poles:[],cables:[],transformers:[],npcs:[],houses:[],spawn:[56.5,GL,59.5],truck:null};

  for(let x=12;x<=100;x++) for(let z=12;z<=100;z++){
    const rx=inRoad(x), rz=inRoad(z);

  for(let x=1;x<WX-1;x+=1) for(let z=1;z<WZ-1;z+=1){ const h=groundH(x,z); const out=x<12||x>100||z<12||z>100; const edge=!out&&(x<19||x>93||z<19||z>93)&&!inRoad(x)&&!inRoad(z)&&get(x,GL-1,z)===1;
    if((out&&hash(x,z,3)<0.035&&!(z>=58&&z<=68&&x>=88))||(edge&&hash(x,z,4)<0.06)){ if(hash(x,z,5)<0.35) palm(x,z,h); else if(get(x,h,z)===0) tree(x,z,h); } }

function house(x0,z0,w,d,wall,roofKind,doorSide,shop){
  const H=4; for(let x=x0;x<x0+w;x++) for(let z=z0;z<z0+d;z++) for(let y=GL;y<GL+H;y++){ const edge=x===x0||x===x0+w-1||z===z0||z===z0+d-1; setB(x,y,z,edge?wall:0); }
  for(let x=x0;x<x0+w;x++) for(let z=z0;z<z0+d;z++) setB(x,GL-1,z,12);
  const win=(x,y,z)=>{ setB(x,y,z,16); WORLD.windows.push({x,y,z,sector:0}); };
  const mx=x0+Math.floor(w/2), mz=z0+Math.floor(d/2);
  // puerta hacia la calle
  const dz=doorSide==='S'?z0+d-1:z0, bz=doorSide==='S'?z0:z0+d-1;
  setB(x0+1,GL,dz,0); setB(x0+1,GL+1,dz,0);
  // ventanas: una junto a la puerta, una en cada lado y dos atrás
  win(x0+2,GL+1,dz); win(x0,GL+1,mz); win(x0+w-1,GL+1,mz); win(x0+1,GL+1,bz); win(x0+2,GL+1,bz);
  if(roofKind==='teja'){ for(let x=x0-1;x<=x0+w;x++) for(let z=z0-1;z<=z0+d;z++) setB(x,GL+H,z,11); for(let x=x0;x<x0+w;x++) for(let z=z0;z<z0+d;z++) setB(x,GL+H+1,z,11); for(let x=x0+1;x<x0+w-1;x++) for(let z=z0+1;z<z0+d-1;z++) setB(x,GL+H+2,z,11); }
  else { for(let x=x0;x<x0+w;x++) for(let z=z0;z<z0+d;z++) setB(x,GL+H,z,wall===6?5:6); for(let x=x0;x<x0+w;x++){ setB(x,GL+H+1,z0,wall); setB(x,GL+H+1,z0+d-1,wall); } }
  if(shop){ // toldo de colores
    const zz=doorSide==='S'?z0+d:z0-1; for(let x=x0-1;x<=x0+w;x++) setB(x,GL+2,zz,(x%2?shop[0]:shop[1])); }
  WORLD.houses.push({x0,z0,w,d});
}
function buildBlockOfHouses(x0,x1,z0,z1,i,j,k){
  const walls=[7,8,9,10,6,30,7,9];
  const lots=[[x0+1,z0+1],[x0+6,z0+1],[x0+1,z0+6],[x0+6,z0+6]];
  lots.forEach(([lx,lz],n)=>{
    if(hash(i*7+n,j*11,2)<0.18&&k==='casas'){ mango(lx+2,lz+2); return; }
    const top=n<2; const side=top?'N':'S';
    let shop=null; if(k==='bodega'&&n===2) shop=[26,6]; if(k==='panaderia'&&n===2) shop=[24,30];
    house(lx,lz,4,4,walls[(i*3+j*5+n)%walls.length],hash(i,j*3+n,6)<0.6?'teja':'plana',side,shop); });
}
function buildPlaza(x0,x1,z0,z1){
  for(let x=x0+1;x<x1;x++) for(let z=z0+1;z<z1;z++) setB(x,GL-1,z,1);
  const cx=Math.floor((x0+x1)/2), cz=Math.floor((z0+z1)/2);
  for(let x=x0+1;x<x1;x++){ setB(x,GL-1,cz,5); } for(let z=z0+1;z<z1;z++) setB(cx,GL-1,z,5);
  for(let d=-4;d<=4;d++){ setB(cx+d,GL-1,cz+d,5); setB(cx+d,GL-1,cz-d,5); }
  for(let x=cx-1;x<=cx+1;x++) for(let z=cz-1;z<=cz+1;z++){ setB(x,GL,z,3); setB(x,GL+1,z,3); }
  for(let y=GL+2;y<=GL+5;y++) setB(cx,y,cz,21); setB(cx-1,GL+4,cz,21); setB(cx+1,GL+4,cz,21); setB(cx,GL+6,cz,21);
  [[x0+2,z0+2],[x1-2,z0+2],[x0+2,z1-2],[x1-2,z1-2]].forEach(([a,b])=>mango(a,b));
  [[cx-3,cz+2],[cx+3,cz+2],[cx-3,cz-2],[cx+3,cz-2]].forEach(([a,b])=>setB(a,GL,b,12));
  [[cx-2,cz-4],[cx+2,cz+4],[cx-4,cz+2],[cx+4,cz-2]].forEach(([a,b])=>{ for(let y=GL;y<GL+3;y++) setB(a,y,b,22); setB(a,GL+3,b,18); });
}
function buildChurch(x0,x1,z0,z1){
  const bx0=x0+1, bx1=x1-1, bz0=z0+2, bz1=z1-1; // fachada mirando al sur (a la plaza)
  for(let x=bx0;x<=bx1;x++) for(let z=bz0;z<=bz1;z++) for(let y=GL;y<GL+8;y++){ const edge=x===bx0||x===bx1||z===bz0||z===bz1; setB(x,y,z,edge?6:0); }
  for(let x=bx0;x<=bx1;x++) for(let z=bz0;z<=bz1;z++) setB(x,GL+8,z,11);
  for(let x=bx0+1;x<bx1;x++) for(let z=bz0;z<=bz1;z++) setB(x,GL+9,z,11);
  for(const tx of [bx0,bx1-2]) for(let x=tx;x<tx+3;x++) for(let z=bz1-2;z<=bz1;z++) for(let y=GL;y<GL+12;y++){ const edge=x===tx||x===tx+2||z===bz1-2||z===bz1; setB(x,y,z,edge?6:0); if(y===GL+9&&x===tx+1&&z===bz1) setB(x,y,z,0); }
  for(const tx of [bx0,bx1-2]){ for(let x=tx;x<tx+3;x++) for(let z=bz1-2;z<=bz1;z++) setB(x,GL+12,z,11); setB(tx+1,GL+13,bz1-1,11); }
  const cx=Math.floor((bx0+bx1)/2);
  for(let x=cx-1;x<=cx+1;x++) for(let y=GL;y<GL+3;y++) setB(x,y,bz1,0);
  for(let x=cx-1;x<=cx+1;x++) setB(x,GL+3,bz1,12);
  setB(cx,GL+5,bz1,24); setB(cx-1,GL+5,bz1,25); setB(cx+1,GL+5,bz1,26);
  for(let y=GL+8;y<=GL+11;y++) setB(cx,y,bz1,21); setB(cx-1,GL+10,bz1,21); setB(cx+1,GL+10,bz1,21);
  WORLD.windows.push({x:cx,y:GL+5,z:bz1,sector:0,keep:true});
}
function buildCourt(x0,x1,z0,z1){
  for(let x=x0+1;x<x1;x++) for(let z=z0+1;z<z1;z++) setB(x,GL-1,z,(x===x0+1||x===x1-1||z===z0+1||z===z1-1||z===Math.floor((z0+z1)/2))?29:25);
  const cx=Math.floor((x0+x1)/2);
  for(const zz of [z0+2,z1-2]){ for(let y=GL;y<GL+4;y++) setB(cx,y,zz,22); setB(cx,GL+4,zz,6); setB(cx-1,GL+4,zz,6); setB(cx+1,GL+4,zz,6); setB(cx,GL+3,zz+(zz<(z0+z1)/2?1:-1),26); }
  for(const [a,b] of [[x0+1,z0+1],[x1-1,z1-1]]){ for(let y=GL;y<GL+5;y++) setB(a,y,b,22); setB(a,GL+5,b,18); }
}
function buildSubstation(x0,x1,z0,z1){
  for(let x=x0+1;x<x1;x++) for(let z=z0+1;z<z1;z++) setB(x,GL-1,z,3);
  for(let x=x0+1;x<x1;x++){ setB(x,GL,z0+1,22); setB(x,GL,z1-1,22); } for(let z=z0+1;z<z1;z++){ setB(x0+1,GL,z,22); setB(x1-1,GL,z,22); }
  setB(x0+1,GL,Math.floor((z0+z1)/2),0);
  for(const [a,b] of [[x0+3,z0+3],[x0+7,z0+3],[x0+3,z0+7],[x0+7,z0+7]]){ for(let x=a;x<a+2;x++) for(let z=b;z<b+2;z++) for(let y=GL;y<GL+2;y++) setB(x,y,z,3); setB(a,GL+2,b,22); setB(a+1,GL+2,b+1,22); }
}
function mango(x,z){ const h=groundH(x,z); for(let y=h;y<h+3;y++) setB(x,y,z,15);
  for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++) for(let dy=0;dy<=2;dy++){ if(dx*dx+dz*dz+(dy-1)*(dy-1)*1.5>5.5) continue; if(get(x+dx,h+3+dy,z+dz)===0) setB(x+dx,h+3+dy,z+dz,14); } }
function tree(x,z,h){ for(let y=h;y<h+4;y++) setB(x,y,z,15); for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++) for(let dy=3;dy<=5;dy++){ if(Math.abs(dx)+Math.abs(dz)+(dy===5?1:0)>2) continue; if(get(x+dx,h+dy,z+dz)===0) setB(x+dx,h+dy,z+dz,13); } }
function palm(x,z,h){ for(let y=h;y<h+5;y++) setB(x,y,z,15); const t=h+5; setB(x,t,z,13); for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ setB(x+dx,t,z+dz,13); setB(x+dx*2,t-1,z+dz*2,13); } }
const FONT={U:['10001','10001','10001','10001','10001','10001','01110'],P:['11110','10001','10001','11110','10000','10000','10000'],A:['01110','10001','10001','11111','10001','10001','10001'],T:['11111','00100','00100','00100','00100','00100','00100']};
function letters(word,x0,z){ const cols=[24,25,26,24,25]; let base=0; for(let x=x0;x<x0+word.length*6;x++) base=Math.max(base,groundH(x,z)); base+=1;
  [...word].forEach((ch,li)=>{ const g=FONT[ch]; for(let r=0;r<7;r++) for(let c=0;c<5;c++){ if(g[r][c]==='1'){ const x=x0+li*6+c, y=base+(6-r); setB(x,y,z,cols[li]); setB(x,y,z+1,cols[li]); } }
    for(let c of [1,3]) for(let y=groundH(x0+li*6+c,z+1);y<base;y++) setB(x0+li*6+c,y,z+1,12); }); }

let gl=null, prog=null, U={}, cubeBuf=null, chunks=[];
const CH=16, NCX=Math.ceil(WX/CH), NCZ=Math.ceil(WZ/CH);
const VS=`attribute vec3 aP;attribute vec3 aC;attribute float aG;uniform mat4 uVP;uniform mat4 uM;uniform vec3 uTint;uniform float uGlow;varying vec3 vC;varying float vG;varying vec3 vW;
void main(){vec4 w=uM*vec4(aP,1.0);vW=w.xyz;vC=aC*uTint;vG=max(aG,uGlow);gl_Position=uVP*w;}`;
const FS=`precision mediump float;varying vec3 vC;varying float vG;varying vec3 vW;uniform vec3 uFog;uniform vec3 uCam;uniform vec3 uLamp;uniform float uAmb;
void main(){float d=length(vW-uCam);vec3 q=vW-uLamp;float lamp=exp(-dot(q,q)/55.0)*0.95;vec3 lit=vC*(uAmb+lamp);vec3 c=mix(lit,vC*1.15,vG);float f=smoothstep(28.0,70.0,d)*(1.0-vG*0.55);gl_FragColor=vec4(mix(c,uFog,f),1.0);}`;
function initGL(cv){
  gl=cv.getContext('webgl',{antialias:true,alpha:false})||cv.getContext('experimental-webgl'); if(!gl) return false;
  const sh=(t,s)=>{ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog); gl.useProgram(prog);

const FACES=[

    const vr=0.94+hash(x*3+y,z*5+y,1)*0.12;
    for(const f of FACES){ const nx=x+f.n[0], ny=y+f.n[1], nz=z+f.n[2];

  let prev=null, t=0;

    if(get(x,y,z)&&t>0.3) return {x,y,z,prev};
    prev=[x,y,z]; const a=tM[0]<tM[1]?(tM[0]<tM[2]?0:2):(tM[1]<tM[2]?1:2); t=tM[a]; tM[a]+=tD[a]; if(a===0) x+=st[0]; else if(a===1) y+=st[1]; else z+=st[2]; }
  return null; }

/* ======================= Constantes del motor ======================= */
const SEG=200, RUMBLE=3, ROADW=2000, CAMH=1000, DRAW=190;
const DEPTH=1/Math.tan(50*Math.PI/180);
const PZ=CAMH*DEPTH;
const MAXS=SEG*60;
const ACCEL=MAXS/4.2, BRAKE=-MAXS*1.3, DECEL=-MAXS/5, OFFDECEL=-MAXS/1.6, OFFLIMIT=MAXS/4;
const KMH=v=>Math.round(v/MAXS*140);

const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeIn=(a,b,p)=>a+(b-a)*p*p, easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n), pick=a=>a[ri(a.length)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const css=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const overlap=(x1,w1,x2,w2)=>Math.abs(x1-x2)<(w1+w2);
const fmtTime=t=>{ t=Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };

/* ======================= Estado ======================= */
let cvs, ctx, shade, sx, W=0, H=0, CTL=120;
let R=null, T=null, CB={}, segs=[], cars=[], GOAL=0;
let state='off', position=0, speed=0, playerX=0, fuel=100, timeT=0, shake=0, invul=0, steer=0, skyOff=0;
let stats=null, CP=null, stopFired=null, light=1, phase='on', phaseT=20, flickT=0, stopT=0, refuel=false, hornCD=0;
let raf=0, last=0;
const input={steer:0,brake:false,pad:null};
const keys={};

function resize(){
  if(!cvs) return; const dpr=Math.min(devicePixelRatio||1,2);
  W=cvs.clientWidth||innerWidth; H=cvs.clientHeight||innerHeight;
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  shade.width=Math.max(1,Math.round(W/2)); shade.height=Math.max(1,Math.round(H/2));
  const c=$r('#rCtl'); CTL=c?c.getBoundingClientRect().height:120;
}
const HZ=()=>(H-CTL)*(H>W*1.25?0.47:0.52)+ (H>W*1.25?20:0);

/* ======================= Construir la carretera ======================= */
function lastY(){ return segs.length?segs[segs.length-1].p2.world.y:0; }
function addSeg(curve,y){ const n=segs.length;
  segs.push({i:n,curve,sprites:[],cars:[],clip:0,pool:0,bridge:false,town:false,bomba:false,
    p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}}, p2:{world:{y,z:(n+1)*SEG},camera:{},screen:{}}}); }
function addRoad(e,h,l,curve,y){ const sy=lastY(), t=e+h+l;
  for(let n=0;n<e;n++) addSeg(easeIn(0,curve,n/e),easeInOut(sy,y,n/t));
  for(let n=0;n<h;n++) addSeg(curve,easeInOut(sy,y,(e+n)/t));
  for(let n=0;n<l;n++) addSeg(easeInOut(curve,0,n/l),easeInOut(sy,y,(e+h+n)/t)); }
const findSeg=z=>segs[clamp(Math.floor(z/SEG),0,segs.length-1)];

function build(){
  segs=[]; const N=Math.floor(GOAL/SEG);
  const bS=R.bridge?Math.floor(R.bridge[0]*N):Infinity, bE=R.bridge?Math.floor(R.bridge[1]*N):Infinity;
  const towns=R.stops.filter(s=>!s.alone).map(s=>Math.floor(s.at*N));
  addRoad(30,70,30,0,0);
  const need=N+DRAW+60;
  while(segs.length<need){
    const i=segs.length;
    if(i>=bS-40&&i<bE){ addRoad(20,Math.max(10,bE-i+10),20,0,lastY()); continue; }
    const nearTown=towns.some(t=>i>t-70&&i<t+50);
    let len=pick([25,40,60,80]); if(i<bS-40&&i+len*3>bS-40) len=Math.max(8,Math.floor((bS-40-i)/3));
    const curve=(nearTown||Math.random()<T.straight)?0:(Math.random()<.5?-1:1)*pick(T.curves)*(nearTown?.4:1);
    const y=(nearTown||Math.random()<T.flat)?lastY():rnd(-T.hill,T.hill)*SEG;
    addRoad(len,len,len,curve,y);
  }
  addRoad(20,DRAW+40,20,0,lastY());

  for(let i=bS;i<Math.min(bE,segs.length);i++) segs[i].bridge=true;
  towns.forEach(t=>{ for(let i=Math.max(0,t-45);i<Math.min(segs.length,t+45);i++) segs[i].town=true; });
  for(let i=Math.max(0,N-130);i<segs.length;i++) segs[i].town=true;
  for(let i=0;i<60;i++) segs[i].town=true;

  const put=(i,sp)=>{ if(segs[i]) segs[i].sprites.push(sp); };
  // alumbrado, árboles y edificios
  for(let i=0;i<segs.length;i++){ const s=segs[i];
    if(s.bridge){ if(i%3===0){ put(i,{t:'rail',off:-1.1}); put(i,{t:'rail',off:1.1}); } if(i%10===0) put(i,{t:'lamp',off:(i/10)%2?1.1:-1.1}); continue; }
    if(s.town){ if(i%8===0) put(i,{t:'lamp',off:(i/8)%2?1.15:-1.15});
      if(i%3===0&&Math.random()<.8) put(i,{t:'bldg',off:(Math.random()<.5?-1:1)*rnd(1.9,3.8),k:rnd(.7,1.5),seed:ri(99999)}); continue; }
    if(i%36===0) put(i,{t:'lamp',off:(i/36)%2?1.15:-1.15});
    if(i>20) for(const [kind,p] of T.trees){ if(Math.random()<p){ const side=Math.random()<.5?-1:1; put(i,{t:kind,off:side*rnd(1.5,3.8),k:rnd(.8,1.25)}); } }
  }
  // letreros de distancia y de salida
  put(12,{t:'sign',off:1.5,a:'SALIDA',b:R.from.toUpperCase()});
  for(let k=1;k<10;k++){ const i=Math.floor(k/10*N); if(segs[i]&&!segs[i].bridge) put(i,{t:'sign',off:1.5,a:R.to.toUpperCase(),b:Math.round(R.km*(1-k/10))+' km'}); }
  // pueblos, bombas y alcabalas
  R.stops.forEach(st=>{ const c=Math.floor(st.at*N); st.seg=c;
    if(!st.alone) put(c-48,{t:'sign',off:-1.55,a:'BIENVENIDOS A',b:st.name.toUpperCase()});
    if(st.bomba){ const b=st.alone?c:c+14; st.bSeg=b; put(b-60,{t:'sign',off:1.5,a:'BOMBA',b:'1 km'}); put(b-22,{t:'sign',off:1.5,a:'BOMBA',b:'CANAL DERECHO'});
      for(let i=b;i<b+16;i++) if(segs[i]){ segs[i].bomba=true; segs[i].sprites=segs[i].sprites.filter(sp=>sp.off<0); }
      put(b+8,{t:'bomba',off:1.75}); }
  });
  R.alcabalas.forEach(a=>{ const c=Math.floor(a*N); put(c-45,{t:'sign',off:1.5,a:'ALCABALA',b:'40 km/h'});
    for(let i=c-8;i<=c+3;i+=2){ put(i,{t:'cone',off:-0.95}); put(i,{t:'cone',off:0.95}); }
    put(c,{t:'booth',off:1.45}); segs[c].alcabala=true; });
  // meta
  put(N,{t:'arch',off:0,a:R.to.toUpperCase()});
  // pozos de luz de los faroles
  for(let i=0;i<segs.length;i++) if(segs[i].sprites.some(sp=>sp.t==='lamp')) for(let d=-4;d<=4;d++){ const s=segs[i+d]; if(s) s.pool=Math.max(s.pool,1-Math.abs(d)/5); }
  // peligros y bidones
  let nextCan=Math.floor(N*0.09);
  for(let i=70;i<N-12;i++){ const s=segs[i]; if(s.bomba||s.alcabala) continue; const prog=i/N;
    if(i===nextCan){ put(i,{t:'can',off:rnd(-.7,.7)}); nextCan+=Math.floor(N*rnd(.09,.14)); continue; }
    if(s.bridge) continue;
    if(Math.random()<(0.009+0.018*prog)*R.holes){ put(i,{t:'hole',off:rnd(-.78,.78),k:rnd(.8,1.3)}); if(prog>.5&&Math.random()<.22) put(i,{t:'hole',off:rnd(-.78,.78),k:rnd(.7,1.1)}); }
    if(R.rocks&&Math.random()<.0035+.004*prog) put(i,{t:'roca',off:rnd(-.7,.7),k:rnd(.8,1.2)});
    if(R.cows&&!s.town&&Math.random()<.0022) put(i,{t:'vaca',off:(Math.random()<.5?-1:1)*1.7,vx:0,go:false});
  }
}

const CAR_COLORS=['#d9dadf','#2355b0','#b3261e','#2d2f36','#e2b000','#2f6d40','#8a8f99','#f2f2f2','#6a3fa0'];
const LANES=[-0.62,0,0.62];
function newCar(z){ const r=Math.random(); const kind=r<.2?'gandola':r<.34?'buseta':'car';
  const car={z,off:pick(LANES),tx:0,speed:MAXS*(kind==='gandola'?rnd(.2,.32):rnd(.26,.52)),col:pick(CAR_COLORS),kind}; car.tx=car.off; return car; }
function placeCar(c){ const s=findSeg(c.z); s.cars.push(c); c.seg=s; }
function moveCar(c,z){ const o=c.seg; c.z=z; const s=findSeg(z); if(s!==o){ const k=o.cars.indexOf(c); if(k>=0) o.cars.splice(k,1); s.cars.push(c); c.seg=s; } }
function spawnCars(from){ segs.forEach(s=>s.cars=[]); cars=[]; for(let i=0;i<R.cars;i++){ const c=newCar(from+3500+i*rnd(2400,4000)); placeCar(c); cars.push(c); } }
function updateCars(dt){
  for(const c of cars){ let z=c.z+c.speed*dt;
    if(z<position-SEG*3){ z=position+DRAW*SEG*rnd(.72,.98); Object.assign(c,newCar(z)); }
    if(z>GOAL-SEG*25) z=GOAL-SEG*25;
    if(c.off!==c.tx) c.off+=clamp(c.tx-c.off,-dt*1.1,dt*1.1);
    moveCar(c,z); }
}
function honk(){
  if(hornCD>0||state!=='play') return; hornCD=0.6; beep();
  let moved=false;
  for(const c of cars){ const d=c.z-(position+PZ); if(d<0||d>SEG*45) continue; if(Math.abs(c.off-playerX)>0.45) continue;
    const free=LANES.filter(l=>Math.abs(l-c.off)>0.3).sort((a,b)=>Math.abs(b-playerX)-Math.abs(a-playerX)); c.tx=free[0]; moved=true; }
  const ps=findSeg(position+PZ).i;
  for(let i=ps;i<ps+70;i++){ const s=segs[i]; if(!s) break; for(const sp of s.sprites) if(sp.t==='vaca'&&!sp.hit){ if(!sp.dir) sp.dir=sp.off<0?-1:1; else sp.dir=sp.off<0?-1:1; sp.go=true; sp.run=true; } }
  if(moved) msg('¡Pi pi!','El carro de adelante te dio paso',1);
}

let eng=null;

  try{ const o1=ac.createOscillator(), o2=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(), g2=ac.createGain();
    o1.type='sawtooth'; o2.type='square'; f.type='lowpass'; f.frequency.value=420; f.Q.value=4; g.gain.value=0; g2.gain.value=.35;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(ac.destination); o1.start(); o2.start(); eng={o1,o2,f,g,ac}; }catch{ eng=null; } }

function engStop(){ if(!eng) return; const e=eng; eng=null; try{ e.g.gain.setTargetAtTime(0,e.ac.currentTime,.05); setTimeout(()=>{ try{ e.o1.stop(); e.o2.stop(); e.g.disconnect(); }catch{} },300); }catch{} }

  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02); }

  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); const s=ac.createBufferSource(); s.buffer=b; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; const g=ac.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(); }

const S={ crash(){ noise(.35,900,.55); tone(90,.25,'square',.1,0,40); }, hole(){ noise(.18,500,.65); tone(70,.15,'sine',.28,0,45); },
  can(){ tone(660,.09,'triangle',.18); tone(990,.14,'triangle',.18,.08); }, cut(){ tone(220,.6,'sawtooth',.07,0,55); noise(.12,3000,.14); },
  back(){ tone(120,.25,'sawtooth',.05,0,240); tone(480,.1,'sine',.07,.2); }, cone(){ tone(300,.07,'square',.05); noise(.08,1500,.2); },

  fill(){ tone(880,.05,'sine',.03); }, win(){ [523,659,784,1047,1318].forEach((f,i)=>tone(f,.32,'triangle',.14,i*.12)); },
  lose(){ [392,330,262].forEach((f,i)=>tone(f,.35,'triangle',.14,i*.18)); } };

let msgT=0;

function updateLight(dt){
  phaseT-=dt;
  if(phase==='on'){ light=1; if(phaseT<=0){ phase='flick'; phaseT=1.2; S.cut(); } }
  else if(phase==='flick'){ flickT-=dt; if(flickT<=0){ light=light>.5?.15:1; flickT=rnd(.05,.14); } if(phaseT<=0){ phase='off'; phaseT=rnd(10,14); light=0; $r('#rApagon').hidden=false; msg('¡Se fue la luz!','Te alumbra el faro… y Chispita',1.6); } }
  else if(phase==='off'){ light=0; if(phaseT<=0){ phase='back'; phaseT=.9; S.back(); } }
  else if(phase==='back'){ flickT-=dt; if(flickT<=0){ light=light>.5?.1:1; flickT=rnd(.05,.12); } if(phaseT<=0){ phase='on'; phaseT=rnd(20,32); light=1; $r('#rApagon').hidden=true; msg('Volvió la luz','',1); } }
}
function readKeys(){
  const kl=keys.arrowleft||keys.a, kr=keys.arrowright||keys.d, kb=keys.arrowdown||keys[' ']||keys.s;
  if(input.pad==null){ input.steer=kl&&!kr?-1:kr&&!kl?1:0; }
  input.kbBrake=!!kb;
}
function crash(text,loss){ speed=Math.min(speed,MAXS/7); shake=.55; invul=.9; fuel-=loss; stats.crashes++; S.crash(); vib(110); msg(text,`−${loss} de gasolina`,1.1); }
function update(dt){
  if(msgT>0){ msgT-=dt; if(msgT<=0) $r('#rMsg').classList.remove('on'); }
  if(hornCD>0) hornCD-=dt;
  if(state==='intro'){ // la carretera se mueve sola detrás de la tarjeta
    speed=MAXS*.38; position+=speed*dt; const ps=findSeg(position+PZ); playerX=lerp(playerX,-ps.curve*.05,dt*2); steer=lerp(steer,-ps.curve*.1,dt*3);
    if(position>GOAL*.5) position=0; skyOff+=ps.curve*.0006*.38; updateCars(dt); return; }
  if(state!=='play') return;
  readKeys(); timeT+=dt; updateLight(dt);
  const pSeg=findSeg(position+PZ), sp=speed/MAXS;
  // alcabala: parado un momento
  if(stopT>0){ stopT-=dt; speed=0; engSet(0,true); if(stopT<=0) msg('Siga, ciudadano','¡Buen viaje!',1); updateCars(dt); return; }
  // manejo: la dirección responde incluso despacio
  steer=lerp(steer,input.steer,Math.min(1,dt*12));
  playerX+=steer*dt*(0.75+1.35*sp);
  playerX-=dt*sp*sp*pSeg.curve*0.16;
  const braking=input.brake||input.kbBrake;
  if(braking) speed+=BRAKE*dt; else speed+=ACCEL*(1-sp*.55)*dt;
  if(Math.abs(playerX)>1){
    if(pSeg.bridge){ playerX=clamp(playerX,-1.02,1.02); if(sp>.3&&invul<=0){ speed*=.97; shake=Math.max(shake,.15); } }
    else { if(speed>OFFLIMIT) speed+=OFFDECEL*dt; shake=Math.max(shake,.06*sp);
      if(invul<=0) for(const s of pSeg.sprites){ const w={lamp:.05,palm:.09,arbol:.14,mango:.16,pino:.12,piedra:.12,sign:.18,bldg:.6,booth:.2}[s.t]; if(w&&overlap(playerX,.09,s.off,w)){ crash('¡Cuidado!',4); break; } } }
  }
  position=Math.min(position+speed*dt,GOAL+10);
  // lo que está en la vía
  for(const s of pSeg.sprites){
    if(s.t==='hole'&&!s.hit&&invul<=0&&overlap(playerX,.08,s.off,.06*s.k)){ s.hit=true; stats.holes++; speed*=.45; shake=.45; invul=.4; fuel-=4; S.hole(); vib(60); msg('¡Hueco!','−4 de gasolina',1); }
    else if(s.t==='can'&&!s.got&&overlap(playerX,.1,s.off,.07)){ s.got=true; fuel=Math.min(100,fuel+25); stats.cans++; S.can(); msg('+ Gasolina','Un bidón en la vía',.9); }
    else if(s.t==='roca'&&!s.hit&&invul<=0&&overlap(playerX,.09,s.off,.1*s.k)){ s.hit=true; crash('¡Derrumbe!',6); }
    else if(s.t==='cone'&&!s.hit&&overlap(playerX,.08,s.off,.05)){ s.hit=true; speed*=.8; S.cone(); }
    else if(s.t==='vaca'&&!s.hit&&invul<=0&&Math.abs(s.off)<1&&overlap(playerX,.09,s.off,.14)){ s.hit=true; S.moo(); crash('¡Una vaca!',5); }
  }
  for(const c of pSeg.cars){ const w=c.kind==='gandola'?.17:c.kind==='buseta'?.15:.13;
    if(invul<=0&&speed>c.speed&&overlap(playerX,.09,c.off,w)){ position=c.z-PZ-SEG*.7; crash(c.kind==='gandola'?'¡Casi te comes la gandola!':'¡Choque!',5); speed=c.speed*.5; break; } }
  // alcabala
  if(pSeg.alcabala&&!pSeg.checked){ pSeg.checked=true; const k=KMH(speed);
    if(k>55){ stopT=2.4; speed=0; S.whistle(); msg('¡Alto ahí!','El guardia te paró por ir a '+k+' km/h',2.3); }
    else { stats.alcabalas++; msg('Pase, pase','Bien, despacito en la alcabala',1.1); if(stats.alcabalas===3&&CB.alcabala3) CB.alcabala3(); } }
  // bomba de gasolina
  refuel=pSeg.bomba&&playerX>.3&&KMH(speed)<=50;
  if(refuel&&fuel<100){ fuel=Math.min(100,fuel+34*dt); if(Math.random()<dt*8) S.fill(); if(!stats.bomba){ stats.bomba=true; CB.bomba&&CB.bomba(); } }
  $r('#rBomba').hidden=!(refuel&&fuel<100);
  if(pSeg.bomba&&!refuel&&fuel<90&&msgT<=0) msg('¡La bomba!','Métete al canal derecho y frena',1);
  // pueblos: punto de control
  R.stops.forEach(st=>{ if(!stopFired.has(st.name)&&position+PZ>=st.seg*SEG){ stopFired.add(st.name); CP={pos:st.seg*SEG,name:st.name};

      if(v.go&&!v.hit){ v.off+=v.dir*dt*(v.run?1.4:.32); if(Math.abs(v.off)>2.2) v.go=false; } } }
  if(invul>0) invul-=dt;

  fuel-=dt*(.28+.82*sp)*.95;
  skyOff+=pSeg.curve*.0006*sp;
  updateCars(dt);
  if(position+PZ>=GOAL){ arrive(); return; }
  if(fuel<=0){ fuel=0; outOfGas(); return; }
  engSet(speed/MAXS,true);
}

const stars=[]; for(let i=0;i<170;i++) stars.push({x:Math.random(),y:Math.pow(Math.random(),1.6)*.5,r:Math.random()<.1?1.6:rnd(.4,1.1),p:rnd(0,6.28)});
let ridges=null;
function makeRidges(kind){
  const ridge=(n,amp,rough,mode)=>{ const a=[]; let v=.5; for(let i=0;i<n;i++){ v+=rnd(-rough,rough); v=clamp(v,.1,1); a.push(v); }
    let b=a.map((v,i)=>(a[(i-1+n)%n]+v*2+a[(i+1)%n])/4);
    if(mode==='tepuy'){ b=b.map(()=>.15); for(let k=0;k<5;k++){ const c=ri(n), w=2+ri(4), h=rnd(.55,1); for(let j=-w;j<=w;j++){ const idx=(c+j+n)%n; b[idx]=Math.max(b[idx],Math.abs(j)===w?h*.55:h); } } }
    return {pts:b,amp,mode}; };
  if(kind==='andes') return [ridge(56,.3,.35,'peak'),ridge(40,.16,.3)];
  if(kind==='tepuy') return [ridge(60,.16,.2,'tepuy'),ridge(40,.07,.3)];

}
function drawSky(prog,t){
  const hz=HZ(); const g=ctx.createLinearGradient(0,0,0,hz); g.addColorStop(0,T.sky[0]); g.addColorStop(.6,T.sky[1]); g.addColorStop(1,T.sky[2]);

  for(const s of stars){ ctx.globalAlpha=clamp(.45+.55*Math.sin(t*1.3+s.p),.1,1)*(1-prog*.5)*(T===THEMES.andes?.7:1); ctx.fillStyle='#e8ecff'; ctx.fillRect(((s.x-skyOff*.2)%1+1)%1*W,s.y*hz*1.6,s.r,s.r); }

function drawRidge(r,off,base,col,prog,lights){
  const n=r.pts.length, span=W*1.6, step=span/n, shift=((off*span)%span+span)%span;
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-10,H);
  const pts=[];
  for(let i=0;i<=n*2;i++){ const x=i*step-shift; if(x<-step*2) continue; if(x>W+step) break; const y=base-r.pts[i%n]*r.amp*H; pts.push([x,y,r.pts[i%n]]); ctx.lineTo(x,y); }

    pts.forEach(([x,y],k)=>{ for(let j=0;j<3;j++){ const h=((k*37+j*13)%17)/17; ctx.fillRect(x+(j-1)*step*.28,y+(base-y)*(.25+h*.6),1.6,1.6); } }); }
}
function project(p,camX,camY,camZ){ p.camera.x=-camX; p.camera.y=p.world.y-camY; p.camera.z=p.world.z-camZ;
  p.screen.scale=DEPTH/p.camera.z; p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2); p.screen.y=Math.round(HZ()-p.screen.scale*p.camera.y*H/2); p.screen.w=Math.round(p.screen.scale*ROADW*W/2); }

const C0={asph1:[50,52,64],asph2:[45,47,58],rum1:[205,205,210],rum2:[150,36,36],line:[235,184,48],pool:[150,104,52],water1:[16,40,66],water2:[13,34,58],rail1:[140,146,160],rail2:[110,116,130],bomba:[70,78,92]};

  let road=alt?C0.asph1:C0.asph2, grass=alt?T.grass[0]:T.grass[1], rum=alt?C0.rum1:C0.rum2;
  if(s.bridge){ grass=alt?C0.water1:C0.water2; rum=alt?C0.rail1:C0.rail2; }
  if(s.bomba){ grass=C0.bomba; }
  const g=s.pool*lampsOn; if(g>0){ road=mix(road,C0.pool,g*.55); if(!s.bridge) grass=mix(grass,[70,62,30],g*.45); else grass=mix(grass,[120,90,40],g*.35); }

let glow=[];
function render(t){
